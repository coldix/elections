policy:
  party: one-nation
  issue: immigration
  headline: Net-zero / sharply lower migration to ease housing pressure
  claims:
    - id: on-net-zero-migration
      statement: >-
        Reporting on One Nation’s platform states the party will extend a zero-net migration
        policy and focus on permitting only highly skilled migrants from countries it describes
        as culturally cohesive.
      kind: position
      source:
        url: https://www.smh.com.au/politics/federal/does-one-nation-s-migration-policy-actually-add-up-20260721-p60h6v.html
        publisher: The Sydney Morning Herald
        title: Does One Nation's migration policy actually add up?
        published: 2026-07-22
        accessed: 2026-08-09
    - id: on-migration-housing
      statement: >-
        ABC reporting summarises that One Nation links high migration to housing pressure and
        that leader Pauline Hanson says high migration numbers put an unfair burden on housing stock.
      kind: position
      source:
        url: https://www.abc.net.au/news/2026-02-10/one-nation-policy-platforms-pauline-hanson/106296838
        publisher: ABC News
        title: People say they'll vote One Nation. What are they voting for?
        published: 2026-02-10
        accessed: 2026-08-09
