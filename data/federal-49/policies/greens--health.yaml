policy:
  party: greens
  issue: health
  headline: Put dental into Medicare; expand universal public healthcare
  claims:
    - id: greens-dental-medicare
      statement: >-
        The Australian Greens plan includes ensuring affordable dental care for all Australians
        by including dental services in Medicare with a $195 billion investment, framed as
        reducing dental disease and easing cost-of-living pressures.
      kind: pledge
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 195000000000
        amount_display: $195 billion
        timeframe: party plan (undated on portfolio page)
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://greens.org.au/portfolios/health
        publisher: Australian Greens
        title: Health — Policy Portfolio
        accessed: 2026-08-09
    - id: greens-universal-health
      statement: >-
        The Greens state they want to invest in a truly universal healthcare system that puts
        people first, expand Medicare and reduce out-of-pocket costs, funded in part by making
        big corporations pay their fair share of tax.
      kind: position
      source:
        url: https://greens.org.au/portfolios/health
        publisher: Australian Greens
        title: Health — Policy Portfolio
        accessed: 2026-08-09
