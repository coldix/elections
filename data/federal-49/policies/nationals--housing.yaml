policy:
  party: nationals
  issue: housing
  headline: Cut red tape; increase regional housing supply
  claims:
    - id: nats-housing-red-tape
      statement: >-
        The Nationals plan states they will work with all levels of government to cut red tape
        and increase housing supply in regional communities, addressing a housing shortage that
        locks young people out of their own towns.
      kind: pledge
      source:
        url: https://www.nationals.org.au/plan
        publisher: The Nationals
        title: Our Plan for Regional Australia
        accessed: 2026-08-09
    - id: nats-housing-affordability
      statement: >-
        The plan lists increasing housing affordability alongside stopping supermarket price
        gouging and reducing tax as cost-of-living measures for regional families.
      kind: position
      source:
        url: https://www.nationals.org.au/plan
        publisher: The Nationals
        title: Our Plan for Regional Australia
        accessed: 2026-08-09
