policy:
  party: one-nation
  issue: housing
  headline: Cut migration pressure; GST relief on new-home materials
  claims:
    - id: on-housing-via-migration
      statement: >-
        ABC reporting states One Nation’s housing policy is wrapped up in its immigration
        policy, with Hanson arguing high migration places an unfair burden on housing stock.
      kind: position
      source:
        url: https://www.abc.net.au/news/2026-02-10/one-nation-policy-platforms-pauline-hanson/106296838
        publisher: ABC News
        title: People say they'll vote One Nation. What are they voting for?
        published: 2026-02-10
        accessed: 2026-08-09
    - id: on-gst-building
      statement: >-
        To support housing supply, One Nation would cut GST on building materials used in new
        homes up to the value of $1 million and review state charges such as stamp duty on new homes.
      kind: pledge
      source:
        url: https://www.abc.net.au/news/2026-02-10/one-nation-policy-platforms-pauline-hanson/106296838
        publisher: ABC News
        title: People say they'll vote One Nation. What are they voting for?
        published: 2026-02-10
        accessed: 2026-08-09
    - id: on-foreign-ownership
      statement: >-
        One Nation advocates an end to foreign ownership of individual homes and of what it
        considers essential services including roadways and ports.
      kind: pledge
      source:
        url: https://www.abc.net.au/news/2026-02-10/one-nation-policy-platforms-pauline-hanson/106296838
        publisher: ABC News
        title: People say they'll vote One Nation. What are they voting for?
        published: 2026-02-10
        accessed: 2026-08-09
