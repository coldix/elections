# Coalition display relationships for the federal policy matrix.
# Does not merge underlying liberal/nationals policy YAML — presentation only.
# Methodology: docs/policy-methodology.md
#
# Federal display rule: if Nationals have no separate sourced record for an issue,
# the combined matrix shows a single Shared Coalition cell from the Liberal (or
# sole partner) record — not a split box with an empty Nationals half.
coalitions:
  - id: liberal-nationals
    label: Liberal–Nationals Coalition
    short_label: Coalition
    parties: [liberal, nationals]
    default_combined: true
    issues:
      - issue: cost-of-living
        scope: mixed
        shared_policy_id: coalition-federal-col
        representative_party: liberal
        note: >-
          Shared Coalition living-standards framing; Nationals add regional energy supply,
          supermarket competition and farmgate emphasis.
      - issue: housing
        scope: mixed
        shared_policy_id: coalition-federal-housing
        representative_party: liberal
        note: >-
          Shared Coalition plan links migration intake to homes built; Nationals emphasise
          regional supply and cutting red tape in the regions.
      - issue: immigration
        scope: party_specific
        representative_party: liberal
        note: >-
          No separate Nationals immigration record — combined view treats the Liberal/Coalition
          migration-to-housing position as shared until a Nationals-specific source is added.
      - issue: climate-energy
        scope: mixed
        shared_policy_id: coalition-federal-energy
        representative_party: nationals
        note: >-
          Both partners emphasise reliable energy and power bills; Nationals lead the regional
          reliable-supply framing in this ledger.
      - issue: tax-budget
        scope: mixed
        shared_policy_id: coalition-federal-tax
        representative_party: liberal
        note: >-
          Shared Coalition economic-management framing; Nationals stress reducing tax as a
          regional cost-of-living measure.
      - issue: health
        scope: mixed
        shared_policy_id: coalition-federal-health
        representative_party: liberal
        note: >-
          Shared Coalition Medicare bulk-billing investment pledges; Nationals add regional
          GP, specialist and nurse retention incentives.
      - issue: public-media
        scope: party_specific
        representative_party: liberal
        note: >-
          No separate Nationals public-media record — combined view treats the Liberal
          accountability framing as shared Coalition policy until a Nationals-specific source
          is added.
      - issue: defence-security
        scope: party_specific
        representative_party: liberal
        note: >-
          No separate Nationals defence record — combined view treats the Liberal/Coalition
          AUKUS and ADF position as shared until a Nationals-specific source is added.
          One Nation’s separate veterans/BRS-related claims appear in the five-party view and
          One Nation column, not in the Coalition cell.
