      parliament: Bicameral
      total_members: 69
      contest_summary: 47 Assembly districts and 11 of 22 Council places
      tracking_status: Foundation page only; candidate tracking has not started.
      chambers:
        - name: House of Assembly
          role: Lower house
          seats: 47
          constituencies: 47 single-member electoral districts
          election_scope: All 47 seats
          voting_system: Full preferential voting
          term: Four years
        - name: Legislative Council
          role: Upper house
          seats: 22
          constituencies: One statewide electorate
          election_scope: 11 seats
          voting_system: Single transferable vote proportional representation
          term: Eight years; half elected every four years
      sources:
        - url: https://www.ecsa.sa.gov.au/electoral-districts
          publisher: Electoral Commission of South Australia
          title: South Australian electoral districts
          accessed: 2026-08-03
        - url: https://www.ecsa.sa.gov.au/voting/counting-the-votes-for-the-house-of-assembly
