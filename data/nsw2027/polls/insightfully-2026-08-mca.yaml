question_notes: >-
  NSW Legislative Assembly statewide primary voting intention from Insightfully
  research commissioned by the Minerals Council of Australia (MCA). Fieldwork
  5–12 August 2026; online sample of 1,000 NSW voters; margin of error ±2.9% as
  reported via One News Australia from the MCA research pack. Statewide VI:
  Labor 29, One Nation 29, Coalition 18, Greens 13, Independent 9, Others 2
  (Independents folded into others → 11). MCA’s public release emphasises uranium
  mining / ban-awareness issues questions; those issues numbers are not encoded
  as VI. Advocacy-commissioned — ledgered for transparency, out of the average.
