question_notes: >-
  Second Herald Sun "Lighthouse" election tracking poll, conducted by Growth
  Intelligence Centre (News Corp Australia's internal research and data
  analytics operation) via the Lighthouse Consumer Tracker, a continuous
  online survey; n=1,351 Victorian voters, effective sample about 775 after
  weighting (design effect 1351/775), margin of error 3.5 points. Reported
  primaries L-NP 32 (+1), ONP 23 (steady), ALP 21 (-1), GRN 14 (steady),
  others and independents 10 (steady) relative to the first wave
  (19 Oct - 1 Nov). No 2PP reported in the sources read. Net favourability
  Carroll -19, Wilson +17 (not encoded). Exact fieldwork dates were not stated
  in any source read; fieldwork_start and fieldwork_end are set to the 13 Nov
  2026 release date as a placeholder, so the true fieldwork ended on or before
  that date.
