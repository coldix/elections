exclusion_reason: >-
  Growth Intelligence Centre is not on the Victorian pollster allowlist in
  docs/poll-methodology.md (adding a pollster needs an allowlist edit), and
  the source read does not state survey mode or method (rule H). Ledgered
  for transparency; out of the average pending a maintainer allowlist
  decision.
