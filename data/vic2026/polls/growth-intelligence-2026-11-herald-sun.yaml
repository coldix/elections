question_notes: >-
  Herald Sun "Lighthouse Political Monitor" Victorian state voting intention,
  conducted by Growth Intelligence Centre (News Corp's internal research and
  data analytics operation). Campaign tracking poll run as weekly surveys and
  published as a two-week rolling average; this release covers 19 Oct – 1 Nov
  2026, n=1,289, weighted effective sample 887 (design effect 1289/887), MoE
  3.3 points. Reported primaries L-NP 31, ONP 23, ALP 22, GRN 14, others and
  independents 10 (News24 / Daily Telegraph reports of the Herald Sun poll).
  Correction 8 Nov 2026: first encoded from Poll Bludger as ALP 23, ONP 22;
  News Corp's own reports give ALP 22, ONP 23, so the topline was corrected. No 2PP
  reported in the source read. Net favourability Carroll −21, Wilson +9 (not
  encoded). Survey mode and weighting not stated in the source read, so mode
  recorded as "other".
primaries:
  alp: 22
  lnp: 31
