# One Nation Victoria — Cost of Living
policy:
  party: one-nation
  issue: cost-of-living
  headline: Remove insurance duty, end renewable subsidies and redirect wasteful spending
  claims:
    - id: onp-col-insurance-duty
      statement: >-
        One Nation Victoria says it will remove the state government tax on insurance
        premiums to reduce a major household and business expense.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/cost-of-living
        publisher: One Nation Victoria
        title: Cost of Living
        accessed: 2026-08-02
    - id: onp-col-energy-subsidies
      statement: >-
        The party says it will end taxpayer subsidies for wind and solar generation and
        support new coal and gas generation to pursue lower, more reliable power prices.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/cost-of-living
        publisher: One Nation Victoria
        title: Cost of Living
        accessed: 2026-08-02
    - id: onp-col-spending-housing
      statement: >-
        One Nation Victoria proposes ending major “vanity” projects and redirecting
        public resources towards releasing land and easing housing costs.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/cost-of-living
        publisher: One Nation Victoria
        title: Cost of Living
        accessed: 2026-08-02
    - id: onp-col-supermarkets
      statement: >-
        The party says supermarkets should be held accountable for price gouging and
        that government should promote fair dealing with farmers and stronger grocery
        competition.
      kind: position
      source:
        url: https://vic.onenation.org.au/cost-of-living
        publisher: One Nation Victoria
        title: Cost of Living
        accessed: 2026-08-02
