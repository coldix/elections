# One Nation Victoria — Health & Hospitals
policy:
  party: one-nation
  issue: health-hospitals
  headline: Expand the health workforce and rebuild Rosebud Hospital through a PPP
  blind_claim: "More clinicians, PPP hospital rebuild"
  claims:
    - id: onp-health-gp-incentives
      statement: >-
        One Nation Victoria proposes financial incentives for GPs to work in outer
        metropolitan and regional shortage areas, plus grants for medical students
        completing general-practice specialisation.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/health
        publisher: One Nation Victoria
        title: Health Policy
        accessed: 2026-08-02
    - id: onp-health-nursing
      statement: >-
        The party proposes university recruitment partnerships for nursing, more
        flexible hospital employment, action to reduce burnout and a campaign to attract
        more men into nursing.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/health
        publisher: One Nation Victoria
        title: Health Policy
        accessed: 2026-08-02
    - id: onp-health-paramedics
      statement: >-
        One Nation Victoria calls for increased specialist and community-care funding,
        improved paramedic pay, retention measures and stronger mental-health support for
        frontline ambulance staff.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/health
        publisher: One Nation Victoria
        title: Health Policy
        accessed: 2026-08-02
    - id: onp-health-rosebud-ppp
      statement: >-
        The party pledges to redevelop Rosebud Hospital through a public-private
        partnership in which the facility and clinical services remain publicly owned
        and operated while a private partner finances and builds the project.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260815114516/https://vic.onenation.org.au/rosebud-rebuild-ppp
        publisher: One Nation Victoria
        title: One Nation will redevelop the Rosebud Hospital through PPP
        published: 2026-04-27
        accessed: 2026-08-02
    - id: onp-health-booklet-regional-guarantee
      statement: >-
        Guarantee minimum regional services, including 24/7 emergency departments and core
        maternity and surgical capacity in major regional hospitals, with a Local Access
        Test before any major specialty is removed, downgraded or relocated.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-health-booklet-waitlists-records
      statement: >-
        Create a real-time statewide view of surgical and specialist waiting lists,
        require linked interoperable electronic medical records across health networks,
        and redirect administrative savings into more nurses, doctors and beds.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
