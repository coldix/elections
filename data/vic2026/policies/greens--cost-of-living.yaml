# Victorian Greens — Cost of Living (rent as household cost pressure)
policy:
  party: greens
  issue: cost-of-living
  headline: Rent caps framed as renter cost-of-living relief
  claims:
    - id: greens-col-rent-savings
      statement: >-
        “Independent modelling by the Parliamentary Budget Office shows that if
        Victoria froze rents for two years from March 2026 and permanently capped
        future rent increases to wage growth, the average Victorian renter would
        save $15,590 by 2030 and more than $120,000 by 2040.”
      kind: costed_measure
      fiscal:
        taxpayer_label: "Not specified"
        pbo_status: pbo_costed
        timeframe: "to 2030 / 2040 (household savings modelled)"
        pbo_ref:
          url: https://greens.org.au/vic/news/media-release/fastest-rent-hikes-australia-show-why-victoria-needs-rent-caps-saving
          publisher: Australian Greens Victoria (citing Parliamentary Budget Office modelling)
          title: Fastest rent hikes in Australia show why Victoria needs rent caps – saving renters $15,590 by 2030
          published: 2026-07-09
          accessed: 2026-08-02
      source:
        url: https://greens.org.au/vic/news/media-release/fastest-rent-hikes-australia-show-why-victoria-needs-rent-caps-saving
        publisher: Australian Greens Victoria
        title: Fastest rent hikes in Australia show why Victoria needs rent caps – saving renters $15,590 by 2030
        published: 2026-07-09
        accessed: 2026-08-02
    - id: greens-col-renters-need-lower-rents
      statement: >-
        “Renters don't need more excuses. They need lower rents.”
      kind: position
      source:
        url: https://greens.org.au/vic/news/media-release/fastest-rent-hikes-australia-show-why-victoria-needs-rent-caps-saving
        publisher: Australian Greens Victoria
        title: Fastest rent hikes in Australia show why Victoria needs rent caps – saving renters $15,590 by 2030
        published: 2026-07-09
        accessed: 2026-08-02
