# Victorian Greens — Environment & Forestry
policy:
  party: greens
  issue: environment-forestry
  headline: Close native forest logging loopholes
  claims:
    - id: greens-forest-bill
      statement: >-
        The Greens bill would: “Make it illegal for mills in Victoria to process
        native forest timber from anywhere in Australia - including old forests in
        Tasmania; Ban logging on private land; Prevent logging companies from
        exploiting bushfire and storm processes; Repeal laws that would enable
        future governments to bring back native logging on public land –
        future-proofing Victoria’s ban on commercial logging.”
      kind: pledge
      source:
        url: https://greens.org.au/vic/news/media-release/victorian-greens-will-introduce-new-laws-close-loopholes-native-forest
        publisher: Australian Greens Victoria
        title: Victorian Greens will introduce new laws to close loopholes in native forest logging
        published: 2026-06-23
        accessed: 2026-08-02
    - id: greens-forest-sandell
      statement: >-
        “Labor in Victoria is fuelling the destruction of our environment and our
        forests. The Greens will bring a Bill to Parliament to close Labor’s dodgy
        loopholes and protect our precious forests for good.”
      kind: position
      source:
        url: https://greens.org.au/vic/news/media-release/victorian-greens-will-introduce-new-laws-close-loopholes-native-forest
        publisher: Australian Greens Victoria
        title: Victorian Greens will introduce new laws to close loopholes in native forest logging
        published: 2026-06-23
        accessed: 2026-08-02
