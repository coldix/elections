# Australian Labor Party (Victorian Branch) — Crime & Justice
policy:
  party: labor
  issue: crime-justice
  headline: Tougher bail and youth sentencing alongside permanent violence prevention
  blind_claim: "Tougher bail and youth sentences"
  claims:
    - id: labor-crime-safety-budget
      statement: >-
        The 2026–27 Budget provides $1.7 billion for police, courts, corrections,
        youth justice and emergency services, including additional PSOs and police
        reservists intended to return sworn officers to frontline duties.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 1700000000
        amount_display: $1.7 billion
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-what-we-need-keep-victorians-safe-0
        publisher: Premier of Victoria
        title: Labor Delivers What We Need To Keep Victorians Safe
        published: '2026-05-05'
        accessed: '2026-08-02'
    - id: labor-crime-tougher-bail
      statement: >-
        Continue the tougher bail regime brought fully into effect on 31 March 2026,
        supported by additional prison and youth-justice capacity and seven additional
        magistrates.
      kind: position
      source:
        url: https://www.premier.vic.gov.au/victorias-tough-bail-laws-full-effect
        publisher: Premier of Victoria
        title: Victoria's Tough Bail Laws In Full Effect
        published: '2026-03-30'
        accessed: '2026-08-02'
    - id: labor-crime-adult-time
      statement: >-
        Apply Adult Time for Violent Crime to children aged 14 and over charged with
        specified serious violent offences, transferring those matters to adult courts
        where community safety and victim impact receive greater weight.
      kind: position
      source:
        url: https://www.premier.vic.gov.au/adult-time-violent-crime-now-effect
        publisher: Premier of Victoria
        title: Adult Time For Violent Crime Is Now In Effect
        published: '2026-02-27'
        accessed: '2026-08-02'
    - id: labor-crime-vru
      statement: >-
        Make the Violence Reduction Unit a permanent part of the justice system,
        combining early intervention with police and justice responses to youth and
        violent crime.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 30000000
        amount_display: $30 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/violence-reduction-unit-here-stay
        publisher: Premier of Victoria
        title: The Violence Reduction Unit Is Here To Stay
        accessed: '2026-08-02'
    - id: labor-crime-sentencing-review
      statement: >-
        Commission an independent review and rewrite of Victoria's sentencing laws,
        aimed at clearer, more consistent sentencing aligned with community
        expectations.
      kind: pledge
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 3000000
        amount_display: nearly $3 million
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/sentencing-must-meet-community-expectations
        publisher: Premier of Victoria
        title: Sentencing Must Meet Community Expectations
        accessed: '2026-08-02'
