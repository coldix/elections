# Victorian Greens — Education
policy:
  party: greens
  issue: education
  headline: Restore school funding, make public education genuinely free and strengthen TAFE
  claims:
    - id: greens-edu-restore-24b
      statement: Reinstate the $2.4 billion in public-school funding the Greens say the Victorian Government delayed, including funding intended for staff and salaries.
      kind: pledge
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 2400000000
        amount_display: $2.4 billion
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://greens.org.au/vic/news/media-release/greens-say-labor-notice-reinstate-24-billion-public-schools-after-damning
        publisher: Australian Greens Victoria
        title: Greens say Labor is on notice to reinstate $2.4 billion for public schools
        published: '2026-05-14'
        accessed: '2026-08-02'
    - id: greens-edu-free-public
      statement: Phase out fees and out-of-pocket charges in public education so students can participate in core and extracurricular activities regardless of family income.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/education-policy
        publisher: Australian Greens Victoria
        title: Education Policy
        accessed: '2026-08-02'
    - id: greens-edu-teacher-conditions
      statement: Improve teacher pay and conditions, reduce class sizes, provide more planning time and administrative support, and set a benchmark of at least 80% permanent teaching positions in schools and TAFE.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/education-policy
        publisher: Australian Greens Victoria
        title: Education Policy
        accessed: '2026-08-02'
    - id: greens-edu-tafe
      statement: Guarantee recurrent public funding for TAFE, expand free vocational and adult education, and phase out public funding to private providers where an equivalent public option is available.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/education-policy
        publisher: Australian Greens Victoria
        title: Education Policy
        accessed: '2026-08-02'
