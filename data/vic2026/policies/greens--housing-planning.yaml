# Victorian Greens — Housing & Planning
policy:
  party: greens
  issue: housing-planning
  headline: Rent controls, 88,000 public homes, stamp-duty reform and affordable-housing rules
  blind_claim: "Rent controls and 88,000 public homes"
  claims:
    - id: greens-housing-rent-controls
      statement: Freeze rents for two years, then cap annual increases at wage growth or CPI, whichever is lower; tie increases to the property rather than the tenant.
      kind: pledge
      source:
        url: https://greens.org.au/vic/news/media-release/fastest-rent-hikes-australia-show-why-victoria-needs-rent-caps-saving
        publisher: Australian Greens Victoria
        title: Fastest rent hikes in Australia show why Victoria needs rent caps
        published: '2026-07-09'
        accessed: '2026-08-02'
    - id: greens-housing-public-homes
      statement: Stop public-housing demolition, build more than 88,000 public homes and maintain and upgrade existing stock through an initial $4 billion investment.
      kind: costed_measure
      fiscal:
        taxpayer_label: Upfront capital
        amount_aud: 4000000000
        amount_display: $4 billion initial investment
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://greens.org.au/vic/news/media-release/greens-unveil-bold-housing-plan-bring-down-cost-buying-home-abolishing-stamp
        publisher: Australian Greens Victoria
        title: Greens unveil bold housing plan to bring down the cost of buying a home
        published: '2026-07-09'
        accessed: '2026-08-02'
    - id: greens-housing-stamp-duty
      statement: Abolish stamp duty for owner-occupied homes worth up to $1.1 million and reduce it on a sliding scale for homes up to $1.6 million.
      kind: pledge
      fiscal:
        taxpayer_label: Not specified
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://greens.org.au/vic/news/media-release/greens-unveil-bold-housing-plan-bring-down-cost-buying-home-abolishing-stamp
        publisher: Australian Greens Victoria
        title: Greens unveil bold housing plan to bring down the cost of buying a home
        published: '2026-07-09'
        accessed: '2026-08-02'
    - id: greens-housing-affordable-definition
      statement: Legislate a clear, consistent definition of affordable housing linked to what households earn rather than variable discounts from market rent.
      kind: pledge
      source:
        url: https://greens.org.au/vic/news/media-release/so-called-affordable-housing-system-completely-cooked-greens-call-clear
        publisher: Australian Greens Victoria
        title: So-called affordable housing system completely cooked — Greens call for clear legislated definition
        published: '2026-07-16'
        accessed: '2026-08-02'
    - id: greens-housing-planning
      statement: Require meaningful community participation in planning and mandatory minimum proportions of genuinely affordable or public housing in large residential developments.
      kind: position
      source:
        url: https://greens.org.au/vic/policies/planning-policy
        publisher: Australian Greens Victoria
        title: Planning Policy
        accessed: '2026-08-02'
