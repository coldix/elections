# One Nation Victoria — Debt & Budget
policy:
  party: one-nation
  issue: debt-budget
  headline: Spending review, cancel the Suburban Rail Loop and lift the payroll tax threshold
  blind_claim: "Cut spending and payroll tax"
  claims:
    - id: onp-debt-spending-review
      statement: >-
        One Nation Victoria proposes a comprehensive review of state government spending
        to identify and eliminate waste, reduce budget deficits and slow the growth of
        state debt.
      kind: pledge
      fiscal:
        taxpayer_label: Not specified
        pbo_status: uncosted
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/economic-recovery
        publisher: One Nation Victoria
        title: Economic Recovery
        accessed: 2026-08-02
    - id: onp-debt-real-time-reporting
      statement: >-
        The party would introduce a public, real-time reporting tool for departmental
        expenditure and cap spending on high-profile projects it regards as wasteful.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/economic-recovery
        publisher: One Nation Victoria
        title: Economic Recovery
        accessed: 2026-08-02
    - id: onp-debt-payroll-tax
      statement: >-
        One Nation Victoria says it will phase out Victorian payroll tax while using
        grants and tax incentives to encourage manufacturing, technology and regional
        investment.
      kind: pledge
      fiscal:
        taxpayer_label: Not specified
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/economic-recovery
        publisher: One Nation Victoria
        title: Economic Recovery
        accessed: 2026-08-02
    - id: onp-debt-booklet-srl
      statement: >-
        Cancel the Suburban Rail Loop, redirect its funding to other infrastructure, and
        publish the cost of continuing the project alongside the cost of stopping it.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-debt-booklet-bureaucracy-sunset
      statement: >-
        Cut the senior executive layer of the public service while protecting and
        increasing frontline police, teachers, nurses, paramedics and firefighters, and
        introduce public sunset reviews so public entities expire unless Parliament votes
        to continue them.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-debt-booklet-payroll-threshold
      statement: >-
        The October 2026 policy booklet commits to lifting the payroll tax threshold so
        more small employers fall outside the tax; it does not repeat the earlier stated
        phase-out of payroll tax.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
