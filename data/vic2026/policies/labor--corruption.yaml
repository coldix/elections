# Australian Labor Party (Victorian Branch) — Corruption and Integrity
policy:
  party: labor
  issue: corruption
  headline: Retrospective follow-the-money powers and broader IBAC reform
  blind_claim: "Follow-the-money IBAC powers"
  claims:
    - id: labor-integrity-follow-money
      statement: >-
        Give IBAC follow-the-money powers so it can trace public funds through
        private contractors, subcontractors and labour-hire arrangements rather than
        being limited to conduct directly linked to a public officer or body.
      kind: pledge
      source:
        url: https://www.premier.vic.gov.au/ibac-powers-be-expanded
        publisher: Premier of Victoria
        title: IBAC Powers To Be Expanded
        published: '2026-06-01'
        accessed: '2026-08-02'
    - id: labor-integrity-retrospective
      statement: >-
        Make the new follow-the-money powers retrospective so IBAC can examine recent
        allegations and work alongside Victoria Police where criminal conduct may be
        involved.
      kind: pledge
      source:
        url: https://www.premier.vic.gov.au/ibac-powers-be-expanded
        publisher: Premier of Victoria
        title: IBAC Powers To Be Expanded
        published: '2026-06-01'
        accessed: '2026-08-02'
    - id: labor-integrity-reference-group
      statement: >-
        Establish an expert reference group including IBAC, the Ombudsman, Integrity
        Oversight Victoria and Victoria Police to advise by May 2027, with reform
        legislation planned by the end of 2027. The Government supports 21 committee
        recommendations in principle and is reviewing eight others.
      kind: pledge
      source:
        url: https://www.premier.vic.gov.au/ibac-powers-be-expanded
        publisher: Premier of Victoria
        title: IBAC Powers To Be Expanded
        published: '2026-06-01'
        accessed: '2026-08-02'
    - id: labor-integrity-existing-reforms
      statement: >-
        Retain recently introduced integrity measures including publication of
        ministerial diaries and the Parliamentary Integrity and Workplace Standards
        Commission.
      kind: position
      source:
        url: https://www.premier.vic.gov.au/ibac-powers-be-expanded
        publisher: Premier of Victoria
        title: IBAC Powers To Be Expanded
        published: '2026-06-01'
        accessed: '2026-08-02'
