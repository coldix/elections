# Liberal Victoria — Housing & Planning
policy:
  party: liberal
  issue: housing-planning
  headline: Fast-track growth areas, expand inner-city housing and restore local planning input
  blind_claim: "Fast-track growth, restore local planning"
  claims:
  - id: liberal-housing-psp
    statement: Clear the backlog of 27 Precinct Structure Plans in identified growth areas to accelerate serviced land and housing construction.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-25-a-new-plan-to-restore-dreams-of-home-ownership
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: A new plan to restore dreams of home ownership
      published: '2026-02-24'
      accessed: '2026-08-02'
  - id: liberal-housing-ccz
    statement: Expand the Capital City Zone into nearby inner-city areas to enable additional residential development where transport and services already exist.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-25-a-new-plan-to-restore-dreams-of-home-ownership
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: A new plan to restore dreams of home ownership
      published: '2026-02-24'
      accessed: '2026-08-02'
  - id: liberal-housing-local-voice
    statement: Replace Labor’s activity-centre approach with community-led structure plans and restore a stronger role for councils and local communities in middle and outer suburban planning.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/article/2026-05-21-labors-housing-targets-fail-to-deliver-for-victorians
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Labor’s housing targets fail to deliver for Victorians
      published: '2026-05-21'
      accessed: '2026-08-02'
  - id: liberal-housing-regional
    statement: Work directly with regional councils to support additional housing in regional centres.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-25-a-new-plan-to-restore-dreams-of-home-ownership
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: A new plan to restore dreams of home ownership
      published: '2026-02-24'
      accessed: '2026-08-02'
  - id: liberal-housing-stamp-duty
    statement: Abolish stamp duty for eligible first-home buyers on properties valued up to $1 million.
    kind: pledge
    fiscal:
      taxpayer_label: Not specified
      financing: taxpayer
      pbo_status: uncosted
    source:
