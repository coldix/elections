# Australian Labor Party (Victorian Branch) — Housing & Planning
policy:
  party: labor
  issue: housing-planning
  headline: Social housing investment, activity-centre density and faster approvals
  claims:
    - id: labor-housing-social-growth-fund
      statement: >-
        Invest a further $860 million over five years in the Social Housing Growth
        Fund, intended to support more than 7,000 additional social homes over the
        following decade.
      kind: costed_measure
      fiscal:
        taxpayer_label: Upfront capital
        amount_aud: 860000000
        amount_display: $860 million
        timeframe: five years; homes over the next decade
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/making-life-more-affordable
        publisher: Victorian Budget 2026/27
        title: Making life more affordable
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-housing-transport-density
      statement: >-
        Continue concentrating additional housing near train and tram corridors,
        employment and services rather than returning planning authority entirely to
        individual councils.
      kind: position
      source:
        url: https://www.2026.budget.vic.gov.au/making-life-more-affordable
        publisher: Victorian Budget 2026/27
        title: Making life more affordable
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-housing-srl
      statement: >-
        Proceed with tunnelling for Suburban Rail Loop East, which the Government
        describes as supporting around 70,000 additional homes over 30 years around
        the first-stage precincts.
      kind: position
      source:
        url: https://www.2026.budget.vic.gov.au/making-life-more-affordable
        publisher: Victorian Budget 2026/27
        title: Making life more affordable
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-housing-fast-track
      statement: >-
        Continue the Development Facilitation Program to fast-track significant
        housing proposals and unlock land for new supply.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 9800000
        amount_display: $9.8 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/making-life-more-affordable
        publisher: Victorian Budget 2026/27
        title: Making life more affordable
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-housing-stamp-duty
      statement: >-
        Extend the temporary off-the-plan stamp duty concession for eligible units,
        apartments and townhouses until 21 April 2027.
      kind: pledge
      fiscal:
        taxpayer_label: Not specified
        timeframe: to 21 April 2027
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/making-life-more-affordable
        publisher: Victorian Budget 2026/27
        title: Making life more affordable
        published: '2026-05-02'
        accessed: '2026-08-02'
