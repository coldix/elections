        title: Labor Delivers Cost Of Living Help And A Surplus
        published: 2026-05-05
        accessed: 2026-08-02
    - id: labor-housing-stamp-duty
      statement: >-
        “To help slash up-front costs, we are extending stamp duty concessions for
        buying off-the-plan units, townhouses and apartments until 21 April 2027.”
      kind: pledge
      fiscal:
        taxpayer_label: "Not specified"
        financing: taxpayer
        pbo_status: uncosted
        timeframe: "to 21 April 2027"
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-cost-living-help-and-surplus
        publisher: Premier of Victoria
