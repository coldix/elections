# One Nation Victoria — Crime & Justice
policy:
  party: one-nation
  issue: crime-justice
  headline: Tougher bail and sentencing for repeat youth offenders
  blind_claim: "Tougher bail for repeat youth offenders"
  claims:
    - id: onp-crime-bail-sentencing
      statement: >-
        One Nation Victoria proposes stricter sentencing guidelines and amended bail
        laws aimed at keeping dangerous repeat offenders off the streets.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/crime
        publisher: One Nation Victoria
        title: Tackling Crime
        accessed: 2026-08-02
    - id: onp-crime-detention
      statement: >-
        The party supports expanding youth detention capacity and says courts should
        give community safety greater weight when considering bail for repeat offenders.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/crime
        publisher: One Nation Victoria
        title: Tackling Crime
        accessed: 2026-08-02
    - id: onp-crime-victim-support
      statement: >-
        One Nation Victoria proposes a victim support program covering counselling,
        legal assistance and financial help, plus restitution requirements for young
        offenders where appropriate.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/crime
        publisher: One Nation Victoria
        title: Tackling Crime
        accessed: 2026-08-02
    - id: onp-crime-intervention-review
      statement: >-
        The party would examine structured intervention programs for at-risk young people
        and a panel to review serious crimes committed by offenders released on bail.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/crime
        publisher: One Nation Victoria
        title: Tackling Crime
        accessed: 2026-08-02
