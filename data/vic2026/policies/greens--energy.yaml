# Victorian Greens — Energy
policy:
  party: greens
  issue: energy
  headline: 100% renewable energy by 2030, public infrastructure and no new coal or gas
  claims:
    - id: greens-energy-100-renewable
      statement: Transition Victoria to 100% renewable energy by 2030 while maintaining a reliable and stable electricity grid.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/energy-policy
        publisher: Australian Greens Victoria
        title: Energy Policy
        accessed: '2026-08-02'
    - id: greens-energy-public-storage
      statement: Use public investment and ownership for storage and transmission infrastructure, including community-owned microgrids, to support energy security, stable prices and the renewable transition.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/energy-policy
        publisher: Australian Greens Victoria
        title: Energy Policy
        accessed: '2026-08-02'
    - id: greens-energy-home-upgrades
      statement: Establish government-backed loans so households can install efficiency upgrades, solar panels and batteries, with repayment deferred until the home is sold.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/energy-policy
        publisher: Australian Greens Victoria
        title: Energy Policy
        accessed: '2026-08-02'
    - id: greens-energy-ban-new
      statement: Immediately ban all new coal and gas projects and end public support for the existing fossil-fuel industry.
      kind: pledge
      source:
        url: https://greens.org.au/vic/news/media-release/greens-call-urgent-implementation-climate-resilience-inquiry-report-after
        publisher: Australian Greens Victoria
        title: Greens call for urgent implementation of climate resilience inquiry report
        published: '2026-01-16'
        accessed: '2026-08-02'
