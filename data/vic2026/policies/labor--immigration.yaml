# Australian Labor Party — Immigration (federal government policy)
policy:
  party: labor
  issue: immigration
  headline: Federal policy — 185,000 permanent places with an onshore and skilled focus
  claims:
    - id: labor-imm-2026-program
      statement: >-
        [Federal government policy] Set the 2026–27 permanent Migration Program at
        185,000 places, unchanged in total size, with approximately 71 per cent in
        the skilled stream and 28 per cent in the family stream.
      kind: position
      source:
        url: https://immi.homeaffairs.gov.au/what-we-do/migration-program-planning-levels
        publisher: Australian Department of Home Affairs
        title: Permanent Migration Program planning levels
        published: '2026-05-12'
        accessed: '2026-08-02'
    - id: labor-imm-onshore-focus
      statement: >-
        [Federal government policy] Prioritise 129,590 permanent places for migrants
        already living in Australia, while the remaining offshore allocation focuses
        on highly skilled applicants intended to address productivity and long-term
        workforce needs.
      kind: position
      source:
        url: https://immi.homeaffairs.gov.au/what-we-do/migration-program-planning-levels
        publisher: Australian Department of Home Affairs
        title: Permanent Migration Program planning levels
        published: '2026-05-12'
        accessed: '2026-08-02'
    - id: labor-imm-program-composition
      statement: >-
        [Federal government policy] Allocate 132,240 skilled places, including
        employer-sponsored and state or territory nominated visas, and 52,460 family
        places, predominantly partner visas.
      kind: position
      source:
        url: https://immi.homeaffairs.gov.au/what-we-do/migration-program-planning-levels
        publisher: Australian Department of Home Affairs
        title: Permanent Migration Program planning levels
        published: '2026-05-12'
        accessed: '2026-08-02'
    - id: labor-imm-nom-reduction
      statement: >-
        [Federal government framing] Continue reducing net overseas migration while
        retaining skilled migration, with Home Affairs reporting annual net overseas
        migration to December 2025 was more than 45 per cent below the 2023 peak.
      kind: position
      source:
        url: https://minister.homeaffairs.gov.au/TonyBurke/Pages/net-overseas-migration-continues-to-fall.aspx
        publisher: Minister for Home Affairs
        title: Net Overseas Migration continues to fall
        published: '2026-06-18'
        accessed: '2026-08-02'
