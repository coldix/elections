# Australian Labor Party (Victorian Branch) — Health & Hospitals
# Incumbent government delivery and 2026–27 Budget measures.
policy:
  party: labor
  issue: health-hospitals
  headline: Record health funding, hospital capacity and free care outside emergency departments
  blind_claim: "More hospital beds, free non-ED care"
  claims:
    - id: labor-health-total-investment
      statement: >-
        The 2026–27 Budget provides more than $32.3 billion for health, including
        $3.9 billion in new investment across hospitals, ambulance services,
        specialist care and community health.
      kind: costed_measure
      fiscal:
        taxpayer_label: Not specified
        amount_aud: 3900000000
        amount_display: $3.9 billion new investment
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-better-free-healthcare
        publisher: Premier of Victoria
        title: Labor Delivers Better, Free Healthcare
        published: '2026-05-05'
        accessed: '2026-08-02'
    - id: labor-health-hospital-certainty
      statement: >-
        Provide $1.6 billion to public hospitals for activity and service funding,
