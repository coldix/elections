    - id: labor-health-free-dental-2026-08
      statement: >-
        A re-elected Carroll Labor Government says it will invest $230 million to open 10 free
        walk-in Public Dental Clinics (seven in Melbourne, three in regional Victoria), modelled
        on Medicare Urgent Care Clinics, offering free check-ups and treatment and seeing more
        than 100,000 Victorians a year.
      kind: pledge
      source:
        url: https://www.viclabor.org.au/news/only-labor-will-deliver-free-dental-care-for-all-victorians
        publisher: Victorian Labor
        title: Only Labor Will Deliver Free Dental Care For All Victorians
        published: 2026-08-22
        accessed: 2026-10-05

    - id: labor-health-free-abortion-2026-10
      statement: >-
        A re-elected Carroll Labor Government says it will eliminate out-of-pocket costs for medical and surgical abortion care under 16 weeks' gestation at participating providers (no consultation, imaging, testing or medication fees), extend the medical abortion window to 10 weeks, and widen Victorian Patient Travel Assistance Scheme eligibility.
      kind: pledge
      source:
        url: https://www.viclabor.org.au/news/an-abortion-can-cost-1000-labor-will-change-this
        publisher: Victorian Labor
        title: "An Abortion Can Cost $1,000 – Labor Will Change This"
        published: 2026-10-15
        accessed: 2026-10-19

    - id: labor-health-vptas-2026-10
      statement: >-
        A re-elected Carroll Labor Government says it will invest $53.6 million to expand the Victorian Patient Transport Assistance Scheme, lifting the fuel reimbursement from 21 to 35 cents per kilometre and moving to a flat accommodation subsidy of $125 per night.
      kind: pledge
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 53600000
        amount_display: $53.6 million
        timeframe: Not specified
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.viclabor.org.au/news/labor-will-close-the-regional-health-gap
        publisher: Victorian Labor
        title: "Labor Will Close the Regional Health Gap"
        published: 2026-10-13
        accessed: 2026-10-19

    - id: labor-health-ed-wait-times-2026-10
      statement: >-
        A re-elected Carroll Labor Government says it will expand 12 hospital emergency departments (Alfred, Austin, Ballarat Base, Bendigo, Footscray, Latrobe Regional, Royal Children's, Shepparton, Swan Hill, Werribee Mercy, Wonthaggi and University Hospital Geelong) by an average of 25 per cent, hiring 1,500 health workers including 750 nurses and adding 250 beds, which it says will cut wait times at those EDs by up to 20 per cent. Labor describes it as an ongoing $1.5 billion investment.
      kind: pledge
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 1500000000
        amount_display: $1.5 billion
        timeframe: Not specified
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.viclabor.org.au/news/labor-will-slash-wait-times
        publisher: Victorian Labor
        title: "Labor Will Slash ED Wait Times by up to 20%"
        published: 2026-10-25
        accessed: 2026-10-26
