# Victorian Greens — Infrastructure & Transport
policy:
  party: greens
  issue: infrastructure-transport
  headline: Permanent free public transport, more frequent services and safer active transport
  blind_claim: "Permanent free public transport"
  claims:
    - id: greens-transport-free
      statement: Make trains, trams and buses permanently free across metropolitan and regional Victoria.
      kind: pledge
      source:
        url: https://greens.org.au/vic/campaigns/make-public-transport-free
        publisher: Australian Greens Victoria
        title: Make Public Transport Free
        accessed: '2026-08-02'
    - id: greens-transport-frequency
      statement: Increase train, tram and bus frequency, including high-frequency electric bus networks and early works for additional metropolitan and regional rail capacity.
      kind: pledge
      source:
        url: https://greens.org.au/vic/morept
        publisher: Australian Greens Victoria
        title: More Public Transport
        accessed: '2026-08-02'
    - id: greens-transport-active-150m
      statement: The Greens secured a legislated share of Melbourne's congestion levy providing five councils with $150 million over a decade for bike lanes, accessible station connections and walking infrastructure.
      kind: costed_measure
      fiscal:
        taxpayer_label: Upfront capital
        amount_aud: 150000000
        amount_display: $150 million
        timeframe: over a decade
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://greens.org.au/vic/news/media-release/greens-secure-15o-million-active-transport-over-next-decade
        publisher: Australian Greens Victoria
        title: Greens secure $150 million for active transport over the next decade
        published: '2025-11-20'
        accessed: '2026-08-02'
    - id: greens-transport-electric
      statement: Transition public transport—including buses, coaches and regional trains—to fully electric services powered by renewable energy.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/transport-and-freight-policy
        publisher: Australian Greens Victoria
        title: Transport and Freight Policy
        accessed: '2026-08-02'
    - id: greens-transport-public-ownership
      statement: Keep public transport infrastructure publicly owned and operated and oppose new privately operated toll roads.
      kind: position
      source:
        url: https://greens.org.au/vic/policies/transport-and-freight-policy
        publisher: Australian Greens Victoria
        title: Transport and Freight Policy
        accessed: '2026-08-02'
