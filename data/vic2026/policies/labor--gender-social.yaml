# Australian Labor Party (Victorian Branch) — Gender Equality & Social Policy
policy:
  party: labor
  issue: gender-social
  headline: Family violence reform, gender-responsive budgeting and LGBTIQA+ equality
  claims:
    - id: labor-social-family-violence
      statement: >-
        Continue prevention, refuges, crisis accommodation and the Personal Safety
        Initiative as part of the 2026–27 family violence package.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 100000000
        amount_display: $100 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-what-we-need-keep-victorians-safe-0
        publisher: Premier of Victoria
        title: Labor Delivers What We Need To Keep Victorians Safe
        published: '2026-05-05'
        accessed: '2026-08-02'
    - id: labor-social-information-sharing
      statement: >-
        Continue the Central Information Point, which shares information between
        agencies about family violence perpetrators.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 23000000
        amount_display: more than $23 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-what-we-need-keep-victorians-safe-0
        publisher: Premier of Victoria
        title: Labor Delivers What We Need To Keep Victorians Safe
        published: '2026-05-05'
        accessed: '2026-08-02'
    - id: labor-social-protection-laws
      statement: >-
        Extend family violence intervention orders to better protect victim-survivors,
        recognise offending that occurs interstate, strengthen stalking law and add
        procedural protections for vulnerable victims and witnesses.
      kind: position
      source:
        url: https://www.premier.vic.gov.au/new-laws-protect-women-and-children
        publisher: Premier of Victoria
        title: New Laws To Protect Women And Children
        published: '2025-11-13'
        accessed: '2026-08-02'
    - id: labor-social-lgbtiqa-equality
      statement: >-
        Maintain support for LGBTIQA+ equality, including the conversion-practices
        ban, anti-vilification protections and grants that expand community services
        in metropolitan and regional Victoria.
      kind: position
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 1600000
        amount_display: $1.6 million sector-strengthening grants
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/labor-supporting-lgbtiqa-victorians
        publisher: Premier of Victoria
        title: Labor Is Supporting LGBTIQA+ Victorians
        published: '2026-05-07'
        accessed: '2026-08-02'
