# Liberal Party of Australia – Victorian Division — Crime & Justice
policy:
  party: liberal
  issue: crime-justice
  headline: Safer Communities Plan — police, bail, Adult Crime Adult Time
  blind_claim: "Tougher bail, adult time for youth crime"
  claims:
    - id: liberal-crime-safer-communities
      statement: >-
        “Only my Liberal and Nationals team has a plan to end Labor’s crime crisis
        and keep Victorians safe. Labor’s weak laws and revolving-door bail system
        are putting dangerous offenders back on the street and continuing the cycle
        of crime. The system must change.”
      kind: position
      source:
        url: https://jamesnewbury.com.au/joint-statement-tougher-bail-and-sentencing-laws-to-keep-victorians-safe/
        publisher: James Newbury MP (joint statement with Jess Wilson)
        title: Joint Statement — Tougher bail and sentencing laws to keep Victorians safe
        published: 2026-04-15
        accessed: 2026-08-02
    - id: liberal-crime-adult-time-expand
      statement: >-
        Under the Liberals and Nationals’ Safer Communities Plan, a future Jess
        Wilson-led Government will: “Implement genuine Adult Crime, Adult Time laws
        by expanding the number of serious offences uplifted to the County Court by
        adding a further twelve offences, including burglary, serious assault and
        attempted murder.”
      kind: pledge
      source:
        url: https://jamesnewbury.com.au/joint-statement-tougher-bail-and-sentencing-laws-to-keep-victorians-safe/
        publisher: James Newbury MP (joint statement with Jess Wilson)
        title: Joint Statement — Tougher bail and sentencing laws to keep Victorians safe
        published: 2026-04-15
        accessed: 2026-08-02
    - id: liberal-crime-one-strike
      statement: >-
        “Introduce a strict one-strike bail rule for these uplifted serious offences,
        meaning offenders on bail who re-offend will be automatically denied bail.”
      kind: pledge
      source:
        url: https://jamesnewbury.com.au/joint-statement-tougher-bail-and-sentencing-laws-to-keep-victorians-safe/
        publisher: James Newbury MP (joint statement with Jess Wilson)
        title: Joint Statement — Tougher bail and sentencing laws to keep Victorians safe
        published: 2026-04-15
        accessed: 2026-08-02
    - id: liberal-crime-3000-police
      statement: >-
        These bail and sentencing reforms are part of the Liberals and Nationals’
        Safer Communities Plan, “which includes hiring 3,000 more police, 200 new
        PSOs, reopening more than 40 police stations and returning PSOs to 120 train
        stations, as well as investing in crime prevention and rehabilitation
        initiatives.”
      kind: pledge
      fiscal:
        taxpayer_label: "Not specified"
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://jamesnewbury.com.au/joint-statement-tougher-bail-and-sentencing-laws-to-keep-victorians-safe/
        publisher: James Newbury MP (joint statement with Jess Wilson)
        title: Joint Statement — Tougher bail and sentencing laws to keep Victorians safe
        published: 2026-04-15
        accessed: 2026-08-02
    - id: liberal-crime-prevention-psos-retail-our-plan
      statement: >-
        Invest $100 million in early intervention and rehabilitation, including a
        residential 'Restart' discipline program for serious repeat offenders aged 12 to
        17, and deploy PSO strike teams to high-risk shopping centres alongside new
        Workplace Protection Orders banning violent offenders from shopping precincts.
      kind: pledge
      source:
        url: https://vic.liberal.org.au/Uploads/1784863237800WVVXJGP_our-plan/2026-plan.pdf
        publisher: Liberal Victoria (joint Liberal–Nationals plan)
        title: Our Plan to Deliver for Victorians
        accessed: '2026-10-05'
    - id: liberal-crime-youth-bootcamp-2026-11
      statement: >-
        A Liberal and Nationals government says it will establish a bootcamp for young offenders at the former Dhurringile Prison, modelled on Queensland's Circuit Breaker program, with a compulsory daily routine of physical activity, farm work, cleaning, maintenance, cooking, laundry, education and skills programs. Courts would be able to send offenders aged 14 to 17 there as an alternative to a community corrections order or other custodial sentence.
      kind: pledge
      source:
        url: https://vicliberal.org.au/media-releases/tough-new-bootcamp-to-get-young-offenders-on-the-right-path
        publisher: Victorian Liberal Party (joint Liberal–Nationals statement)
        title: Tough new bootcamp to get young offenders on the right path
        published: 2026-11-15
        accessed: 2026-11-16
    - id: liberal-crime-celestes-law-2026-11
      statement: >-
        A Liberal and Nationals government says "Celeste's Law" will implement all Victorian Law Reform Commission stalking recommendations, extend family violence courtroom protections such as pre-recorded evidence to other stalking victims, trial offender-pays 24/7 GPS monitoring of high-risk stalkers under intervention orders, mandate specialist stalking training for police, and strengthen digital stalking laws, overseen by a Department of Justice taskforce and funded from its $100 million Safer Communities Fund.
      kind: pledge
      source:
        url: https://vicliberal.org.au/media-releases/2026-11-15-celestes-law-to-strengthen-protections-for-stalking-victims
        publisher: Victorian Liberal Party (joint Liberal–Nationals statement)
        title: Celeste's Law to strengthen protections for stalking victims
        published: 2026-11-16
        accessed: 2026-11-16
