# The Nationals Victoria — Energy
policy:
  party: nationals
  issue: energy
  headline: Energy choice, urban solar parks and a pause on major transmission projects
  claims:
  - id: nationals-energy-gas
    statement: Reverse Victoria’s restrictions on new gas connections and reopen the state to conventional gas exploration, presenting household energy choice and additional supply as affordability measures.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-01-06-liberals-and-nationals-launch-ad-campaign-against-labors-gas-ban
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals campaign against Labor’s gas ban
      published: '2026-01-06'
      accessed: '2026-08-02'
  - id: nationals-energy-urban-solar
    statement: Establish Urban Solar Parks to encourage solar and battery installations on commercial and industrial rooftops close to electricity demand.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-06-driving-down-energy-costs-and-protecting-farmer-rights?topic=energy-and-emissions-reduction
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Driving down energy costs and protecting farmer rights
      published: '2026-05-06'
      accessed: '2026-08-02'
  - id: nationals-energy-transmission-review
    statement: Pause VNI West and the Western Renewables Link while conducting a full cost-benefit review of the Victorian Transmission Plan and its alternatives.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-06-driving-down-energy-costs-and-protecting-farmer-rights?topic=energy-and-emissions-reduction
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Driving down energy costs and protecting farmer rights
      published: '2026-05-06'
      accessed: '2026-08-02'
  - id: nationals-energy-landholder-rights
    statement: Reverse compulsory-acquisition provisions and other measures the Coalition says diminish farmers’ rights during transmission development.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-06-driving-down-energy-costs-and-protecting-farmer-rights?topic=energy-and-emissions-reduction
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Driving down energy costs and protecting farmer rights
      published: '2026-05-06'
      accessed: '2026-08-02'
