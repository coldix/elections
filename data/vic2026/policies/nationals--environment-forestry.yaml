# The Nationals Victoria — Environment & Forestry
policy:
  party: nationals
  issue: environment-forestry
  headline: Agricultural impact tests, landholder protections and restoration of native forestry
  blind_claim: "Restore native forestry"
  claims:
  - id: nationals-env-ag-audits
    statement: Require independent agricultural and economic impact assessments for major renewable-energy and transmission proposals to protect prime farmland and food production.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-12-liberals-and-nationals-stand-up-for-victorian-farmers
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals stand up for Victorian farmers
      published: '2026-02-11'
      accessed: '2026-08-02'
  - id: nationals-env-landholder-rights
    statement: Pause VNI West and the Western Renewables Link during a transmission-plan review and restore appeal and landholder protections around compulsory acquisition.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-06-driving-down-energy-costs-and-protecting-farmer-rights?topic=energy-and-emissions-reduction
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Driving down energy costs and protecting farmer rights
      published: '2026-05-06'
      accessed: '2026-08-02'
  - id: nationals-env-native-timber
    statement: Reverse the closure of Victoria’s native timber industry and support a regulated, accredited native-forestry sector.
    kind: pledge
    source:
      url: https://vic.nationals.org.au/native-timber-industry-petition/
      publisher: The Nationals Victoria
      title: Native timber industry petition
      accessed: '2026-08-02'
  - id: nationals-env-transition-audit
    statement: Use the Auditor-General’s findings to argue for greater accountability for native-timber transition spending and direct assistance to affected workers and communities.
    kind: position
    source:
      url: https://vic.nationals.org.au/media-releases/melina-bath-mp-auditor-general-report-exposes-failure-of-labors-native-timber-transition/
      publisher: The Nationals Victoria
      title: Auditor-General report exposes failure of native timber transition
      published: '2026-04-10'
      accessed: '2026-08-02'
