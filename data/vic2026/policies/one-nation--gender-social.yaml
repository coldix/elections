# One Nation Victoria — Gender Equality & Social Policy
policy:
  party: one-nation
  issue: gender-social
  headline: Roll back school gender programs and prioritise sex-based protections
  blind_claim: "End school gender programs"
  claims:
    - id: onp-gender-safe-schools
      statement: >-
        One Nation Victoria proposes a feasibility study and staged rollback of the Safe
        Schools and Respectful Relationships programs, with greater parental control over
        discussions of gender identity and sexual orientation.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/education-policy
        publisher: One Nation Victoria
        title: Education Policy
        accessed: 2026-08-02
    - id: onp-gender-gsa-primary
      statement: >-
        The party says it would prohibit Gender and Sexuality Alliances in primary
        schools and restrict exposure of students under 16 to gender-identity material
        it considers ideological.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/education-policy
        publisher: One Nation Victoria
        title: Education Policy
        accessed: 2026-08-02
    - id: onp-gender-prison-safety
      statement: >-
        One Nation Victoria argues that female prisons should be organised around
        biological sex and that the safety of female inmates should take precedence over
        gender self-identification in placement decisions.
      kind: position
      source:
        url: https://vic.onenation.org.au/news/women-prison-safety
        publisher: One Nation Victoria
        title: Biological Reality and Women Inmates' Right to Safety
        published: 2026-02-09
        accessed: 2026-08-02
    - id: onp-gender-equal-opportunity-act-2026-11
      statement: >-
        One Nation Victoria deputy leader Colleen Harkin announced the party would amend the Equal Opportunity Act 2010 to prioritise biological sex over gender identity in law, policy and practice, saying the policy would apply to female-only facilities such as bathrooms, changerooms, shelters, prisons and family violence refuges, and to women's sport, wherever these receive state government funding.
      kind: pledge
      source:
        url: https://www.outinperth.com/victorian-pride-lobby-condemns-one-nations-attack-on-trans-and-gender-diverse-victorians/
        publisher: OUTinPerth (reporting One Nation Victoria media conference)
        title: Victorian Pride Lobby condemns One Nation's attack on trans and gender diverse Victorians
        published: 2026-11-16
        accessed: 2026-11-17
