# Liberal Victoria — Corruption and Integrity
policy:
  party: liberal
  issue: corruption
  headline: Royal commission, stronger IBAC powers and a construction-sector watchdog
  claims:
  - id: liberal-corruption-royal-commission
    statement: Establish a royal commission into alleged CFMEU misconduct on Victorian government major projects, including the flow of public money to organised crime and political organisations.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-15-strong-action-to-stamp-out-labors-major-project-misconduct-media-release-and-attachment
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Strong action to stamp out major project misconduct
      published: '2026-02-14'
      accessed: '2026-08-02'
  - id: liberal-corruption-ibac-money
    statement: Give IBAC stronger ‘follow the money’ powers to investigate public funds paid through third parties and pursue misappropriated taxpayer money.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-17-new-powers-to-chase-down-every-cent-lost-to-labors-major-project-corruption
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: New powers to chase down every cent lost to major project corruption
      published: '2026-02-17'
      accessed: '2026-08-02'
  - id: liberal-corruption-watchdog
    statement: Create Construction Enforcement Victoria and apply mandatory background checks designed to exclude organised-crime and outlaw-motorcycle-gang links from government-funded worksites.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-03-02-liberals-and-nationals-unveil-sweeping-anti-corruption-plan
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals unveil sweeping anti-corruption plan
      published: '2026-03-02'
      accessed: '2026-08-02'
  - id: liberal-corruption-racketeering
    statement: Introduce anti-racketeering measures aimed at crime bosses and organised criminal networks operating around major projects.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-03-02-liberals-and-nationals-unveil-sweeping-anti-corruption-plan
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals unveil sweeping anti-corruption plan
      published: '2026-03-02'
      accessed: '2026-08-02'
