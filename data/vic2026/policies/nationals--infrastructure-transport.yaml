# National Party of Australia - Victoria — Infrastructure & Transport
policy:
  party: nationals
  issue: infrastructure-transport
  headline: $5bn roads plan; Fair Share Guarantee for regions
  claims:
    - id: nationals-infra-obrien-roads
      statement: >-
        Nationals Leader and Shadow Minister for Roads and Road Safety, Danny
        O’Brien, said the roads plan forms a broader commitment to regional Victoria
        through the Fair Share Guarantee. “Roads have been falling apart all across
        Victoria and Victorians are fed-up with half-hearted patch up jobs that
        quickly fall apart.” “Under Labor, our regions receive less than 12 per cent
        of infrastructure spending despite making up 25 per cent of the state’s
        population.” He said 25 per cent of the state’s infrastructure spending will
        be directed to the regions.
      kind: pledge
      source:
        url: https://www.abc.net.au/news/2026-07-13/vic-road-maintenance-funding-liberal-national-election-promise/106906820
        publisher: ABC News
        title: Victorian Liberals and Nationals promise multi-billion dollar road repair
        published: 2026-07-13
        accessed: 2026-08-02
    - id: nationals-infra-5b
      statement: >-
        The Victorian Coalition will invest $5 billion to repair and rebuild the
        state’s roads if elected in November, including a plan to eliminate one
        million potholes and a $5 billion investment in road maintenance over four
        years.
      kind: costed_measure
      fiscal:
        taxpayer_label: "Upfront capital"
        amount_aud: 5000000000
        amount_display: "$5 billion"
        timeframe: "over four years"
        financing: taxpayer
        pbo_status: uncosted
