# One Nation Victoria — Housing & Planning
policy:
  party: one-nation
  issue: housing-planning
  headline: Reduce demand, release land and cut taxes and planning delays
  blind_claim: "Cut demand, release land, faster approvals"
  claims:
    - id: onp-housing-foreign-ownership
      statement: >-
        One Nation Victoria advocates a ban on foreign ownership of residential
        property, with existing foreign owners given time to sell, to increase the stock
        available to Australian buyers.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/housing-policy
        publisher: One Nation Victoria
        title: Housing Policy
        accessed: 2026-08-02
    - id: onp-housing-costs
      statement: >-
        The party proposes reviewing state fees, taxes, charges and duties with a view
        to reducing or removing those that increase housing costs, including insurance
        duty.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/housing-policy
        publisher: One Nation Victoria
        title: Housing Policy
        accessed: 2026-08-02
    - id: onp-housing-granny-flats
      statement: >-
        One Nation Victoria would allow tax-free room rental in an owner’s principal
        residence and remove restrictions preventing granny flats being rented to people
        other than immediate family.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/housing-policy
        publisher: One Nation Victoria
        title: Housing Policy
        accessed: 2026-08-02
    - id: onp-housing-land-approvals
      statement: >-
        The party proposes faster land releases and building approvals, release of
        under-used government land, and collaboration with councils to accelerate
        suitable residential rezoning.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/housing-policy
        publisher: One Nation Victoria
        title: Housing Policy
        accessed: 2026-08-02
    - id: onp-housing-affordable-partnerships
      statement: >-
        One Nation Victoria supports private-sector incentives and community
        partnerships to increase lower-cost housing for low-income households.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/housing-policy
        publisher: One Nation Victoria
        title: Housing Policy
        accessed: 2026-08-02
