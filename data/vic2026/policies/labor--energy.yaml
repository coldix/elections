# Australian Labor Party (Victorian Branch) — Energy
policy:
  party: labor
  issue: energy
  headline: Free midday power, legislated renewable targets and storage-backed reliability
  blind_claim: "Free midday power"
  claims:
    - id: labor-energy-midday-power
      statement: >-
        From 1 October 2026, participating households will receive three hours of
        free electricity every day between 11 am and 2 pm under the Midday Power
        Saver offer. Around 2.6 million households will be eligible, with estimated
        annual savings varying according to how much usage is shifted to midday.
      kind: pledge
      source:
        url: https://www.premier.vic.gov.au/best-midday-power-offer-country
        publisher: Premier of Victoria
        title: Best Midday Power Offer In The Country
        published: '2026-05-28'
        accessed: '2026-08-02'
    - id: labor-energy-renewable-targets
      statement: >-
        Maintain Victoria's legislated renewable electricity targets of 65 per cent
        by 2030 and 95 per cent by 2035, including offshore wind targets of at least
        2 GW by 2032, 4 GW by 2035 and 9 GW by 2040.
      kind: position
      source:
        url: https://www.energy.vic.gov.au/renewable-energy/victorian-renewable-energy-and-storage-targets
        publisher: Victorian Government
        title: Victorian renewable energy and storage targets
        published: '2026-02-17'
        accessed: '2026-08-02'
    - id: labor-energy-storage-firming
      statement: >-
        Deliver at least 2.6 GW of energy storage by 2030 and 6.3 GW by 2035,
        supported by targeted gas-fired generation for peak demand and periods of
        low wind and solar generation.
      kind: position
      source:
        url: https://www.energy.vic.gov.au/renewable-energy/batteries-energy-storage-projects
        publisher: Victorian Government
        title: Batteries and energy storage projects
        accessed: '2026-08-02'
    - id: labor-energy-sec-jobs
      statement: >-
        Continue the state-owned SEC investment and workforce program, including an
        academy intended to train 2,000 electrical trade apprentices over four years
        and a regional energy jobs plan projected to deliver more than $18 billion in
        wages from 2026 to 2040.
      kind: pledge
      source:
        url: https://www.premier.vic.gov.au/our-18-billion-energy-jobs-guarantee-regional-victoria
        publisher: Premier of Victoria
        title: Our $18 Billion Energy Jobs Guarantee To Regional Victoria
        published: '2026-06-08'
        accessed: '2026-08-02'
