# One Nation Victoria — Climate & Biodiversity
policy:
  party: one-nation
  issue: climate-biodiversity
  headline: Oppose Net Zero while funding practical conservation and restoration
  blind_claim: "Oppose Net Zero"
  claims:
    - id: onp-climate-net-zero
      statement: >-
        One Nation Victoria opposes Australia’s Net Zero by 2050 policy and says Victoria
        should instead pursue an energy policy based on reliable and affordable domestic
        resources.
      kind: opposition_to
      source:
        url: https://vic.onenation.org.au/our-environment
        publisher: One Nation Victoria
        title: Looking After Our Environment
        accessed: 2026-08-02
    - id: onp-climate-biodiversity
      statement: >-
        The party supports targeted conservation programs, habitat and landscape
        restoration, responsible land and water management, and protection of native
        flora from poorly sited energy projects.
      kind: position
      source:
        url: https://vic.onenation.org.au/our-environment
        publisher: One Nation Victoria
        title: Looking After Our Environment
        accessed: 2026-08-02
    - id: onp-climate-renewable-siting
      statement: >-
        One Nation Victoria would restrict wind and solar projects on prime agricultural
        land, offshore areas, native forests and sites where it considers bushfire risk
        unacceptable.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/affordable-energy
        publisher: One Nation Victoria
        title: Affordable Energy
        accessed: 2026-08-02
