# One Nation Victoria — Education
policy:
  party: one-nation
  issue: education
  headline: Back-to-basics curriculum, parental control and stronger discipline
  blind_claim: "Back-to-basics and parental control"
  claims:
    - id: onp-edu-basics
      statement: >-
        One Nation Victoria proposes a stronger focus on English, mathematics, science,
        literacy, numeracy, critical thinking and classroom discipline, with ideological
        material removed from the curriculum.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/education-policy
        publisher: One Nation Victoria
        title: Education Policy
        accessed: 2026-08-02
    - id: onp-edu-history
      statement: >-
        The party would reintroduce mandatory Australian history studies emphasising
        British settlement, military history, democratic institutions, patriotism and
        critical analysis.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/education-policy
        publisher: One Nation Victoria
        title: Education Policy
        accessed: 2026-08-02
    - id: onp-edu-school-boards-vouchers
      statement: >-
        One Nation Victoria proposes elected school boards with parents holding at least
        half the positions, together with a school voucher system intended to expand
        parental choice between government and non-government schools.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/education-policy
        publisher: One Nation Victoria
        title: Education Policy
        accessed: 2026-08-02
    - id: onp-edu-progression-discipline
      statement: >-
        The policy would use NAPLAN to identify learning gaps, require year-level
        achievement before progression, strengthen teacher standards and performance
        recognition, and give schools clearer suspension and discipline processes.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/education-policy
        publisher: One Nation Victoria
        title: Education Policy
        accessed: 2026-08-02
    - id: onp-edu-booklet-syllabus
      statement: >-
        Replace the Victorian Curriculum with a sequenced, knowledge-rich syllabus setting
        out what students must learn year by year, prioritising literacy, numeracy,
        science, history and civics, with explicit instruction and systematic phonics.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-edu-booklet-vouchers-trade-schools
      statement: >-
        Introduce school vouchers so public funding follows the student across government,
        independent, faith-based and specialist schools, and expand dedicated trade
        schools with pathways into apprenticeships.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
