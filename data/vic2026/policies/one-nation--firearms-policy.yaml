# One Nation Victoria — Firearms Policy
policy:
  party: one-nation
  issue: firearms-policy
  headline: Streamline lawful ownership, review the NFA and strengthen penalties for criminal use
  blind_claim: "Easier lawful ownership, harder on criminals"
  claims:
  - id: onp-firearms-amnesty
    statement: Legislate an amnesty allowing voluntary surrender or registration of unregistered firearms and examine a market-value voluntary buyback.
    kind: pledge
    source:
      url: https://vic.onenation.org.au/firearms-policy
      publisher: One Nation Victoria
      title: Firearms Policy — Safe, Fair and Responsible
      accessed: '2026-08-02'
  - id: onp-firearms-licences
    statement: Streamline licensing and standardise firearm licences, including category H, to ten-year terms.
    kind: pledge
    source:
      url: https://vic.onenation.org.au/firearms-policy
      publisher: One Nation Victoria
      title: Firearms Policy — Safe, Fair and Responsible
      accessed: '2026-08-02'
  - id: onp-firearms-nfa
    statement: Advocate a review of the National Firearms Agreement to pursue uniform rules and stronger consultation with sporting, recreational and rural users.
    kind: pledge
    source:
      url: https://vic.onenation.org.au/firearms-policy
      publisher: One Nation Victoria
      title: Firearms Policy — Safe, Fair and Responsible
      accessed: '2026-08-02'
  - id: onp-firearms-rural
    statement: Permit regulated use of noise-suppression devices for pest, stock and feral-animal management and facilitate supervised junior participation in shooting sports.
    kind: pledge
    source:
      url: https://vic.onenation.org.au/firearms-policy
      publisher: One Nation Victoria
      title: Firearms Policy — Safe, Fair and Responsible
      accessed: '2026-08-02'
  - id: onp-firearms-criminal-use
    statement: Increase penalties where firearms are brandished or used in crime and strengthen border controls and penalties for illegal weapons trafficking.
    kind: pledge
    source:
      url: https://vic.onenation.org.au/firearms-policy
      publisher: One Nation Victoria
      title: Firearms Policy — Safe, Fair and Responsible
      accessed: '2026-08-02'
