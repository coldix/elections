# One Nation Victoria — Aboriginal Affairs & Reconciliation
policy:
  party: one-nation
  issue: aboriginal-affairs
  headline: Oppose and repeal Victoria's Statewide Treaty framework
  blind_claim: "Repeal Statewide Treaty"
  claims:
    - id: onp-treaty-opposition
      statement: >-
        One Nation Victoria opposed the Statewide Treaty Bill 2025, arguing that it would
        divide Victorians, create unequal treatment and add costly bureaucracy rather
        than improve practical outcomes.
      kind: opposition_to
      source:
        url: https://www.parliament.vic.gov.au/parliamentary-activity/hansard/hansard-details/HANSARD-974425065-32808
        publisher: Parliament of Victoria
        title: Statewide Treaty Bill 2025 — second reading
        published: 2025-10-28
        accessed: 2026-08-02
    - id: onp-treaty-repeal
      statement: >-
        One Nation Victoria lists repeal of the Statewide Treaty framework as a 2026
        election commitment.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/donate
        publisher: One Nation Victoria
        title: Support One Nation Victoria
        accessed: 2026-08-02
    - id: onp-treaty-petition
      statement: >-
        One Nation MP Rikkie-Lee Tyrrell is sponsoring a Legislative Council petition
        calling for repeal of the Statewide Treaty Act 2025 and a return to equal
        treatment under state law.
      kind: pledge
      source:
        url: https://www.parliament.vic.gov.au/get-involved/petitions/repeal-the-statewide-treaty-act-20252/
        publisher: Parliament of Victoria
        title: Petition — Repeal the Statewide Treaty Act 2025
        accessed: 2026-08-02
    - id: onp-treaty-booklet-gellung-warl
      statement: >-
        One Nation Victoria's October 2026 policy booklet commits to scrapping the
        Statewide Treaty entirely, abolishing Gellung Warl and ending its legislated
        funding, which the booklet puts at roughly $70 million a year rising by 2.5 per
        cent annually.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
