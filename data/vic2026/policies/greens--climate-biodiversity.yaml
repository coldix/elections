# Victorian Greens — Climate & Biodiversity
policy:
  party: greens
  issue: climate-biodiversity
  headline: Climate-resilience funding, no new coal or gas and stronger nature laws
  claims:
    - id: greens-climate-ban-new
      statement: Immediately ban all new coal and gas projects.
      kind: pledge
      source:
        url: https://greens.org.au/vic/news/media-release/greens-call-urgent-implementation-climate-resilience-inquiry-report-after
        publisher: Australian Greens Victoria
        title: Greens call for urgent implementation of climate resilience inquiry report
        published: '2026-01-16'
        accessed: '2026-08-02'
    - id: greens-climate-resilience-fund
      statement: Establish a dedicated climate-resilience fund for local adaptation projects such as wetland restoration and energy-efficient homes, funded by coal and gas companies.
      kind: pledge
      fiscal:
        taxpayer_label: Not specified
        financing: mixed
        pbo_status: uncosted
      source:
        url: https://greens.org.au/vic/news/media-release/greens-call-urgent-implementation-climate-resilience-inquiry-report-after
        publisher: Australian Greens Victoria
        title: Greens call for urgent implementation of climate resilience inquiry report
        published: '2026-01-16'
        accessed: '2026-08-02'
    - id: greens-biodiversity-framework
      statement: Create a funded statewide biodiversity framework aimed at reversing ecosystem decline and protecting high-conservation-value terrestrial, freshwater and marine areas.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/biodiversity-policy
        publisher: Australian Greens Victoria
        title: Biodiversity Policy
        accessed: '2026-08-02'
    - id: greens-biodiversity-clearing
      statement: End broad-scale and incremental native-vegetation clearing, strengthen council powers to protect biodiversity and treat offsets as a last resort rather than permission to destroy habitat.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/biodiversity-policy
        publisher: Australian Greens Victoria
        title: Biodiversity Policy
        accessed: '2026-08-02'
    - id: greens-biodiversity-recovery
      statement: Fund and enforce recovery plans for threatened species and ecological communities, with stronger penalties for killing threatened wildlife or destroying habitat.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/biodiversity-policy
        publisher: Australian Greens Victoria
        title: Biodiversity Policy
        accessed: '2026-08-02'
