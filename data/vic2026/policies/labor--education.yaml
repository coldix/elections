# Australian Labor Party (Victorian Branch) — Education
# Incumbent government programs and 2026–27 Budget measures.
policy:
  party: labor
  issue: education
  headline: Free Kinder and TAFE, new schools and disability inclusion
  claims:
    - id: labor-edu-budget-investment
      statement: >-
        The 2026–27 Budget provides $19 billion for education during the year,
        including $5.5 billion in new investment across schools, kindergarten and
        vocational education.
      kind: costed_measure
      fiscal:
        taxpayer_label: Not specified
        amount_aud: 5500000000
        amount_display: $5.5 billion new investment
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.budget.vic.gov.au/realising-potential-our-kids
        publisher: Victorian Budget 2026/27
        title: Realising the potential of our kids
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-edu-buildings
      statement: >-
        Build four new schools and campuses, upgrade 31 schools and construct up to
        22 new kindergartens, alongside five Early Learning Victoria centres.
      kind: costed_measure
      source:
        url: https://www.budget.vic.gov.au/realising-potential-our-kids
        publisher: Victorian Budget 2026/27
        title: Realising the potential of our kids
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-edu-free-kinder
      statement: >-
        Continue Free Kinder for three- and four-year-olds, which the Government
        estimates saves families up to $2,700 per child each year.
      kind: position
      source:
        url: https://www.2026.budget.vic.gov.au/helping-cost-living
        publisher: Victorian Budget 2026/27
        title: Helping with the cost of living
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-edu-free-tafe
      statement: >-
        Maintain the Free TAFE Guarantee and direct at least 70 per cent of Victorian
        vocational education and training funding to TAFE.
      kind: position
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-our-childrens-future
        publisher: Premier of Victoria
        title: Labor Delivers For Our Children's Future
        published: '2026-05-05'
        accessed: '2026-08-02'
    - id: labor-edu-disability-inclusion
      statement: >-
        Continue the Disability Inclusion reforms in government schools, backed by
        more than $2.1 billion to provide additional support for students with
        disability.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 2100000000
        amount_display: more than $2.1 billion
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/labor-delivers-our-childrens-future
        publisher: Premier of Victoria
        title: Labor Delivers For Our Children's Future
        published: '2026-05-05'
        accessed: '2026-08-02'
