# Australian Labor Party (Victorian Branch) — Infrastructure & Transport
# Incumbent government delivery and 2026–27 Budget measures.
policy:
  party: labor
  issue: infrastructure-transport
  headline: Roads blitz, locally built trains and regional freight maintenance
  blind_claim: "Roads blitz and locally built trains"
  claims:
    - id: labor-infra-roads-blitz
      statement: >-
        Invest $1.04 billion in road rebuilding, resurfacing and maintenance, with
        70 per cent of the program directed to regional Victoria and works described
        as equivalent to repairing around 200,000 potholes.
      kind: costed_measure
      fiscal:
        taxpayer_label: Upfront capital
        amount_aud: 1040000000
        amount_display: $1.04 billion
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/record-roads-blitz-target-potholes-and-graffiti
        publisher: Premier of Victoria
        title: Record Roads Blitz To Target Potholes And Graffiti
        published: '2026-04-27'
        accessed: '2026-08-02'
    - id: labor-infra-xtrapolis-trains
      statement: >-
        Purchase 25 additional locally built X'Trapolis 2.0 trains, supporting about
        750 manufacturing and supply-chain jobs and expanding capacity on Melbourne's
        rail network.
      kind: costed_measure
      fiscal:
        taxpayer_label: Upfront capital
        amount_aud: 673600000
        amount_display: $673.6 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/more-trains-and-more-services-and-pt-cheaper-all-year
        publisher: Premier of Victoria
        title: More Trains And More Services — And PT Cheaper All Year
        published: '2026-04-20'
        accessed: '2026-08-02'
    - id: labor-infra-extra-services
      statement: >-
        Fund additional metropolitan and regional train and bus services, including
        services enabled by the Metro Tunnel and expanded regional timetables.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 77500000
        amount_display: $77.5 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/more-trains-and-more-services-and-pt-cheaper-all-year
        publisher: Premier of Victoria
        title: More Trains And More Services — And PT Cheaper All Year
        published: '2026-04-20'
        accessed: '2026-08-02'
    - id: labor-infra-rail-freight
      statement: >-
        Invest $127 million in maintenance and renewal of the regional rail freight
        network, including track, bridges and other infrastructure used by agricultural
        and industrial freight.
      kind: costed_measure
      fiscal:
        taxpayer_label: Upfront capital
        amount_aud: 127000000
        amount_display: $127 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.premier.vic.gov.au/keeping-victorias-rail-freight-track
        publisher: Premier of Victoria
        title: Keeping Victoria's Rail Freight On Track
        accessed: '2026-08-02'

    - id: labor-infra-royalties-for-regions-2026-10
      statement: >-
        A re-elected Carroll Labor Government says it will establish Royalties for the Regions, guaranteeing that every cent Victoria collects in resource royalties is invested back into regional Victoria for schools, hospitals and roads.
      kind: pledge
      source:
        url: https://www.viclabor.org.au/news/labor-will-guarantee-royalties-for-the-regions
        publisher: Victorian Labor
        title: "Labor Will Guarantee Royalties for the Regions"
        published: 2026-10-11
        accessed: 2026-10-19
    - id: labor-infra-vline-services-2026-11
      statement: >-
        A re-elected Carroll Labor Government says it will increase V/Line services by
        24 per cent, more than 550 extra services a week across every line, from 2027 and
        2028. This includes 162 more weekly Melton line services, 249 more to Wyndham Vale,
        101 more on the Bendigo line (including 80 new Kyneton services) and 29 more on the
        Seymour line, with more express off-peak trips from Geelong, Ballarat and Bendigo.
        Labor describes it as part of a more than $1 billion investment in extra public
        transport services.
      kind: pledge
      source:
        url: https://www.viclabor.org.au/news/more-v-line-services-for-our-outer-suburbs-and-regions
        publisher: Victorian Labor
        title: More V/Line Services For Our Outer Suburbs And Regions
        published: 2026-11-12
        accessed: 2026-11-13
