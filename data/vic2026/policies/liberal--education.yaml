# Liberal Victoria — Education
policy:
  party: liberal
  issue: education
  headline: Literacy and Numeracy Guarantee, early specialist support and repeal of the schools tax
  blind_claim: "Literacy first, repeal the schools tax"
  claims:
  - id: liberal-edu-guarantee
    statement: Adopt a Literacy and Numeracy Guarantee aimed at lifting student results by 15 per cent over a decade, with a longer-term objective of 90 per cent of students reaching the top two NAPLAN proficiency bands.
    kind: pledge
    source:
      url: https://www.nationaltribune.com.au/backing-victorian-kids-to-achieve-their-best-liberals-and-nationals-announce-literacy-and-numeracy-guarantee/
      publisher: The National Tribune (republishing Liberal Victoria statement)
      title: 'Backing Victorian kids to achieve their best: Literacy and Numeracy Guarantee'
      published: '2026-07-20'
      accessed: '2026-08-02'
  - id: liberal-edu-curriculum
    statement: Commission a 12-month review to declutter the Victorian Curriculum, reduce teacher workload and strengthen explicit teaching of foundational skills.
    kind: pledge
    fiscal:
      taxpayer_label: Upfront capital
      amount_aud: 200000
      amount_display: $200,000
      timeframe: 12-month review
      financing: taxpayer
      pbo_status: uncosted
    source:
      url: https://www.nationaltribune.com.au/backing-victorian-kids-to-achieve-their-best-liberals-and-nationals-announce-literacy-and-numeracy-guarantee/
      publisher: The National Tribune (republishing Liberal Victoria statement)
      title: 'Backing Victorian kids to achieve their best: Literacy and Numeracy Guarantee'
      published: '2026-07-20'
      accessed: '2026-08-02'
  - id: liberal-edu-school-starters
    statement: From Term 1 of 2028, place occupational therapists and speech pathologists within the Primary School Nursing Program and provide a $500 subsidy towards an initial specialist appointment for eligible children.
    kind: pledge
    source:
      url: https://vic.nationals.org.au/media-releases/kim-okeeffe-mp-okeeffe-backs-new-plan-for-students-to-succeed-from-day-one/
      publisher: The Nationals Victoria
      title: O’Keeffe backs new plan for students to succeed from day one
      published: '2026-06-10'
      accessed: '2026-08-02'
  - id: liberal-edu-schools-tax
    statement: Repeal payroll tax applied to non-government schools.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2025-06-26-three-more-victorian-schools-hit-by-labors-insidious-schools-tax
      publisher: Liberal Victoria
      title: Three more Victorian schools hit by Labor’s schools tax
      published: '2025-06-26'
      accessed: '2026-08-02'
  - id: liberal-edu-technical-colleges-2026-10
    statement: >-
      A Liberal and Nationals Government would establish 10 new full-time Technical Colleges for Years 10 to 12, co-located at existing secondary schools and TAFEs and giving 5,000 students vocational training in trades, healthcare and hospitality, at a cost of $222 million over eight years.
    kind: pledge
    fiscal:
      taxpayer_label: Not specified
      amount_aud: 222000000
      amount_display: $222 million
      timeframe: Eight years
      financing: taxpayer
      pbo_status: uncosted
    source:
      url: https://vicliberal.org.au/media-releases/2026-10-10-bringing-back-technical-colleges-to-boost-our-economy-and-upskill-the-next-generation-of-tradies-sooner
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: "Bringing back Technical Colleges to boost our economy and upskill the next generation of tradies sooner"
      published: '2026-10-11'
      accessed: '2026-10-19'
  - id: liberal-edu-apprenticeships-fund-2026-10
    statement: >-
      A Liberal and Nationals Government would create an Accelerating Apprenticeships Fund covering half the off-the-job training costs per apprentice for businesses employing apprentices in Australian Apprenticeships Priority List occupations, paid as quarterly rebates, at a cost of $115 million.
    kind: pledge
    fiscal:
      taxpayer_label: Not specified
      amount_aud: 115000000
      amount_display: $115 million
      timeframe: Not specified
      financing: taxpayer
      pbo_status: uncosted
    source:
      url: https://vicliberal.org.au/media-releases/2026-10-12-growing-our-economy-by-halving-training-costs-for-businesses-to-hire-more-apprentices
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: "Growing our economy by halving training costs for businesses to hire more apprentices"
      published: '2026-10-13'
      accessed: '2026-10-19'
