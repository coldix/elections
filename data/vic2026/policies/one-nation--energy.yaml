# One Nation Victoria — Energy
policy:
  party: one-nation
  issue: energy
  headline: Coal, gas, nuclear and hydro with no new renewable subsidies
  blind_claim: "Coal, gas, nuclear — no new subsidies"
  claims:
    - id: onp-energy-mix
      statement: >-
        One Nation Victoria supports an energy mix including coal, natural gas, nuclear,
        hydro and other technologies, arguing that reliability and affordability should
        determine investment.
      kind: position
      source:
        url: https://vic.onenation.org.au/affordable-energy
        publisher: One Nation Victoria
        title: Affordable Energy
        accessed: 2026-08-02
    - id: onp-energy-coal
      statement: >-
        The party proposes changing National Electricity Market rules so coal generation
        is not disadvantaged and giving long-term policy certainty for upgrades to
        Victorian coal power infrastructure.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/affordable-energy
        publisher: One Nation Victoria
        title: Affordable Energy
        accessed: 2026-08-02
    - id: onp-energy-renewable-subsidies
      statement: >-
        One Nation Victoria would phase out new taxpayer subsidies for renewable projects
        while allowing existing agreements to run their course.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/energy-policy
        publisher: One Nation Victoria
        title: Affordable Energy Policy
        accessed: 2026-08-02
    - id: onp-energy-siting-bonds
      statement: >-
        It would prohibit specified wind and solar developments on prime agricultural
        land, offshore areas, native forests or high bushfire-risk sites, and require
        rehabilitation bonds for energy projects.
      kind: pledge
      source:
        url: https://vic.onenation.org.au/affordable-energy
        publisher: One Nation Victoria
        title: Affordable Energy
        accessed: 2026-08-02
    - id: onp-energy-booklet-transmission
      statement: >-
        Cancel VNI West, the Western Renewables Link and other large transmission projects
        the booklet ties to net zero, and disband the Western Renewable Energy Zone and
        remove its compulsory acquisition powers.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-energy-booklet-nuclear
      statement: >-
        Repeal the Nuclear Activities (Prohibitions) Act 1983 to end Victoria's state ban
        on nuclear energy.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-energy-booklet-gas
      statement: >-
        Give Victorian household and industrial demand first call on Victorian gas while
        allowing genuine surplus to be exported, hold that Victorian users should not pay
        more than the export price, support offshore gas exploration, and reverse the ban
        on gas connections in new homes.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
