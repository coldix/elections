# Liberal Victoria — Environment & Forestry
policy:
  party: liberal
  issue: environment-forestry
  headline: Agricultural impact tests, landholder protections and a bushfire inquiry
  blind_claim: "Protect landholders, bushfire inquiry"
  claims:
  - id: liberal-env-ag-audits
    statement: Require independent agricultural and economic impact assessments for major renewable-energy and transmission proposals to protect prime farmland and food production.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/news/2026-02-12-liberals-and-nationals-stand-up-for-victorian-farmers
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals stand up for Victorian farmers
      published: '2026-02-11'
      accessed: '2026-08-02'
  - id: liberal-env-landholder-rights
    statement: Pause VNI West and the Western Renewables Link during a transmission-plan review and reverse compulsory-acquisition measures affecting landholders.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-06-driving-down-energy-costs-and-protecting-farmer-rights?topic=energy-and-emissions-reduction
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Driving down energy costs and protecting farmer rights
      published: '2026-05-06'
      accessed: '2026-08-02'
  - id: liberal-env-bushfire-inquiry
    statement: Establish a parliamentary inquiry into the causes, preparedness, response and land-management lessons arising from Victoria’s 2025–26 bushfires.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-02-02-liberals-and-nationals-call-for-parliamentary-inquiry-into-victorian-bushfires?topic=emergency-services
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals call for parliamentary inquiry into Victorian bushfires
      published: '2026-02-02'
      accessed: '2026-08-02'
  - id: liberal-env-cfa-fleet-2026-11
    statement: >-
      A Liberal and Nationals government says it will deliver 335 new CFA trucks over five
      years (building to 100 a year, retiring single-cab tankers within 10 years), 17 new and
      upgraded CFA stations, a recruitment target of 10,000 volunteers over a decade and an
      Emergency Services Volunteer Ombudsman, in a $200 million plan costed by the
      Parliamentary Budget Office. The truck program would begin on 1 July 2027.
    kind: pledge
    source:
      url: https://vic.nationals.org.au/media-releases/danny-obrien-mp-annabelle-cleeland-mp-335-new-fire-trucks-to-back-our-cfa-heroes/
      publisher: The Nationals Victoria (joint Liberal–Nationals statement)
      title: 335 new fire trucks to back our CFA heroes
      published: '2026-11-04'
      accessed: '2026-11-06'
