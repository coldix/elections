# The Nationals Victoria — Debt & Budget
policy:
  party: nationals
  issue: debt-budget
  headline: Back-office hiring freeze, cash surplus by 2032 and tighter expenditure controls
  claims:
  - id: nationals-debt-freeze
    statement: Freeze recruitment into back-office Victorian Public Service roles while excluding frontline teachers, nurses and police; the Coalition estimates natural attrition would save $22 billion over ten years.
    kind: costed_measure
    fiscal:
      taxpayer_label: Ongoing operational
      amount_aud: 22000000000
      amount_display: $22 billion estimated saving
      timeframe: 2026–27 to 2036–37
      financing: taxpayer
      pbo_status: uncosted
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-07-guaranteeing-essential-services-with-a-back-office-hiring-freeze
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Guaranteing essential services with a back-office hiring freeze
      published: '2026-05-07'
      accessed: '2026-08-02'
  - id: nationals-debt-surplus
    statement: Return Victorian Public Service staffing to its population-adjusted 2014–15 level through natural attrition as part of a plan to deliver a cash surplus by 2032 and reduce debt.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/article/2026-05-08-jacinta-allan-admits-cutting-thousands-of-public-service-jobs-media-release-audio
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Public service staffing and the Coalition budget plan
      published: '2026-05-08'
      accessed: '2026-08-02'
  - id: nationals-debt-executive-cap
    statement: Cap base salaries for new senior public-sector contracts at the salary of the Chief Justice of the Supreme Court.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-04-28-restoring-financial-discipline-by-capping-executive-pay?topic=leader-of-the-liberal-party%2Ctreasurer
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Restoring financial discipline by capping executive pay
      published: '2026-04-28'
      accessed: '2026-08-02'
  - id: nationals-debt-tracker
    statement: Introduce a Charter of Budget Honesty and a public real-time expenditure tracker.
    kind: pledge
    source:
      url: https://vic.liberal.org.au/media-releases/2026-05-12-labor-scraps-promised-20-million-industry-development-fund?topic=leader-of-the-liberal-party%2Ctreasurer%2Cindustry
      publisher: Liberal Victoria (joint Liberal–Nationals statement)
      title: Liberals and Nationals comprehensive 10-year economic plan
      published: '2026-05-12'
      accessed: '2026-08-02'
