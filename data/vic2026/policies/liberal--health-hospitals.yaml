# Liberal Party of Australia – Victorian Division — Health & Hospitals
policy:
  party: liberal
  issue: health-hospitals
  headline: West Gippsland hospital $850m commitment
  claims:
    - id: liberal-health-west-gippsland
      statement: >-
        “West Gippsland is a rapidly growing region, but under Labor basic
        infrastructure needs are not being met or keeping pace.” Opposition Leader
        Jess Wilson said a Coalition government would invest $850 million to build a
        new West Gippsland hospital, including 230 beds and treatment spaces, an
        emergency department with 33 treatment spaces, 60 residential care beds, and
        accommodation for healthcare workers.
