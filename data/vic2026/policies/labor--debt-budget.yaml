# Australian Labor Party (Victorian Branch) — Debt & Budget
policy:
  party: labor
  issue: debt-budget
  headline: Operating surpluses while net debt rises in dollars but falls relative to the economy
  claims:
    - id: labor-debt-operating-surplus
      statement: >-
        The 2026–27 Budget forecasts an operating surplus of more than $700 million
        in 2025–26, $1 billion in 2026–27 and $2 billion in 2029–30.
      kind: position
      fiscal:
        taxpayer_label: Not specified
        financing: mixed
        pbo_status: uncosted
        timeframe: 2025–26 to 2029–30
      source:
        url: https://www.budget.vic.gov.au/delivering-our-fiscal-strategy
        publisher: Victorian Budget 2026/27
        title: Delivering our fiscal strategy
        published: '2026-05-03'
        accessed: '2026-08-02'
    - id: labor-debt-nominal-path
      statement: >-
        Budget forecasts show net debt increasing from $165.3 billion in June 2026
        to $199.3 billion in June 2030 while the Government expects debt to fall as a
        share of gross state product from 2026–27 onwards.
      kind: position
      fiscal:
        taxpayer_label: Debt / interest
        amount_aud: 199300000000
        amount_display: $199.3 billion forecast net debt in 2029–30
        timeframe: to June 2030
        financing: borrowing
        pbo_status: uncosted
      source:
        url: https://www.budget.vic.gov.au/sustaining-victorias-economic-growth
        publisher: Victorian Budget 2026/27
        title: Sustaining Victoria's economic growth
        published: '2026-05-03'
        accessed: '2026-08-02'
    - id: labor-debt-operating-cash
      statement: >-
        Maintain positive net operating cash flows across the forward estimates,
        which the Budget forecasts at about $6.3 billion to $6.5 billion annually
        from 2026–27 through 2029–30.
      kind: position
      source:
        url: https://www.budget.vic.gov.au/sustaining-victorias-economic-growth
        publisher: Victorian Budget 2026/27
        title: Sustaining Victoria's economic growth
        published: '2026-05-03'
        accessed: '2026-08-02'
