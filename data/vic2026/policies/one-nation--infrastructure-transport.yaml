# One Nation Victoria — Infrastructure & Transport
policy:
  party: one-nation
  issue: infrastructure-transport
  headline: Regional roads and services, restrained major-project spending and PPP delivery
  blind_claim: "Regional roads, restrain mega-projects"
  claims:
    - id: onp-infra-regional
      statement: >-
        One Nation Victoria supports investment in regional roads, telecommunications,
        hospitals, schools, sporting facilities and water infrastructure to improve
        services and supply-chain productivity outside Melbourne.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260611064954/https://vic.onenation.org.au/rebuilding-our-regions
        publisher: One Nation Victoria
        title: Rebuilding our Regions
        accessed: 2026-08-02
    - id: onp-infra-vanity-projects
      statement: >-
        The party proposes capping expenditure on high-profile projects it regards as
        wasteful and redirecting investment towards essential and productivity-enhancing
        infrastructure.
      kind: pledge
      source:
        url: https://web.archive.org/web/20260715095438/https://vic.onenation.org.au/economic-recovery
        publisher: One Nation Victoria
        title: Economic Recovery
        accessed: 2026-08-02
    - id: onp-infra-ppp
      statement: >-
        One Nation Victoria supports public-private partnerships for selected major
        hospital projects, with private finance and construction but continued public
        ownership and public clinical services.
      kind: position
      source:
        url: https://web.archive.org/web/20260815114516/https://vic.onenation.org.au/rosebud-rebuild-ppp
        publisher: One Nation Victoria
        title: One Nation will redevelop the Rosebud Hospital through PPP
        published: 2026-04-27
        accessed: 2026-08-02
    - id: onp-infra-booklet-rail
      statement: >-
        Cancel the Suburban Rail Loop and redirect funding; finish regional freight and
        commuter track duplication, electrify the Melton line, complete the Airport Rail
        Link and support full completion of Inland Rail.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
    - id: onp-infra-booklet-roads
      statement: >-
        Lock in ongoing funding to clear the regional road maintenance backlog, publish
        the condition and funding of every major regional road, and create a public
        Pothole Portal that tracks repair times.
      kind: pledge
      source:
        url: https://assets.nationbuilder.com/viconenation/pages/951/attachments/original/1791077151/The_Real_Deal_One_Nation_Vic_Policy_Booklet_Oct2026.pdf
        publisher: One Nation Victoria
        title: "The Real Deal for Victoria: One Nation's Policy Platform (policy booklet, October 2026)"
        accessed: 2026-10-05
