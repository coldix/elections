# Victorian Greens — Aboriginal Affairs
policy:
  party: greens
  issue: aboriginal-affairs
  headline: Support Treaty, self-determination and stronger land and cultural-heritage rights
  claims:
    - id: greens-treaty-support
      statement: Support the Victorian Statewide Treaty Bill without amendment as a step toward justice, truth and First Nations self-determination.
      kind: position
      source:
        url: https://greens.org.au/vic/news/media-release/history-making-first-ever-treaty-bill-introduced-victorian-parliament
        publisher: Australian Greens Victoria
        title: History in the making — first-ever Treaty Bill introduced to Victorian Parliament
        published: '2025-09-09'
        accessed: '2026-08-02'
    - id: greens-first-nations-self-determination
      statement: Treat First Nations peoples as partners in policies and services that affect them and support representative bodies elected and accepted by their communities.
      kind: position
      source:
        url: https://greens.org.au/vic/policies/first-nations-peoples
        publisher: Australian Greens Victoria
        title: First Nations Peoples Policy
        accessed: '2026-08-02'
    - id: greens-first-nations-settlements
      statement: Negotiate Traditional Owner settlements that provide land and asset bases for cultural, social and economic development according to community priorities.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/first-nations-peoples
        publisher: Australian Greens Victoria
        title: First Nations Peoples Policy
        accessed: '2026-08-02'
    - id: greens-first-nations-heritage
      statement: Strengthen the Aboriginal Heritage Act so relevant Registered Aboriginal Parties make heritage decisions and cultural items are returned to and managed by Traditional Owners.
      kind: pledge
      source:
        url: https://greens.org.au/vic/policies/first-nations-peoples
        publisher: Australian Greens Victoria
        title: First Nations Peoples Policy
        accessed: '2026-08-02'
    - id: greens-first-nations-justice
      statement: Continue the Aboriginal Justice Agreement and related Koori Courts and justice forums, with targeted action to reduce First Nations over-representation in the justice system.
      kind: position
      source:
        url: https://greens.org.au/vic/policies/first-nations-peoples
        publisher: Australian Greens Victoria
        title: First Nations Peoples Policy
        accessed: '2026-08-02'
