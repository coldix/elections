# Australian Labor Party (Victorian Branch) — Cost of Living
# Incumbent government measures funded or operating during 2026.
policy:
  party: labor
  issue: cost-of-living
  headline: Transport rebates, fuel price controls and targeted household concessions
  blind_claim: "Transport rebates and fuel controls"
  claims:
    - id: labor-col-rego-rebate
      statement: >-
        The 2026–27 Budget funds a 20 per cent rebate on eligible light-vehicle
        registration paid between July 2025 and June 2026, worth up to $186 for one
        vehicle or $372 for two vehicles.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 759000000
        amount_display: $759 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/helping-cost-living
        publisher: Victorian Budget 2026/27
        title: Helping with the cost of living
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-col-half-price-transport
      statement: >-
        Public transport fares are halved from June 2026 until 1 January 2027 across
        metropolitan and regional trains, trams and buses. Free public transport for
        passengers under 18 commenced on 1 January 2026.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 278000000
        amount_display: $278 million
        timeframe: June to December 2026
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/helping-cost-living
        publisher: Victorian Budget 2026/27
        title: Helping with the cost of living
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-col-fuel-cap
      statement: >-
        The Fair Fuel Plan requires retailers to publish a daily maximum fuel price
        that cannot be increased during the following 24-hour period, with Servo
        Saver providing statewide price comparisons.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 5000000
        amount_display: $5 million
        timeframe: 2026–27 Budget
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/helping-cost-living
        publisher: Victorian Budget 2026/27
        title: Helping with the cost of living
        published: '2026-05-02'
        accessed: '2026-08-02'
    - id: labor-col-concessions
      statement: >-
        The Government will provide around $566 million in energy, rates, water and
        sewerage concessions during 2026–27, estimated to save an eligible household
        about $629 on average.
      kind: costed_measure
      fiscal:
        taxpayer_label: Ongoing operational
        amount_aud: 566000000
        amount_display: around $566 million
        timeframe: 2026–27
        financing: taxpayer
        pbo_status: uncosted
      source:
        url: https://www.2026.budget.vic.gov.au/helping-cost-living
        publisher: Victorian Budget 2026/27
        title: Helping with the cost of living
        published: '2026-05-02'
        accessed: '2026-08-02'

    - id: labor-col-land-tax-2026-10
      statement: >-
        A re-elected Carroll Labor Government says it will reverse the 2023 land tax threshold
        change, progressively lifting the threshold from $50,000 back to a $300,000 site value
        over six years (starting with a $25,000 rise in 2027–28), which it says will save more
        than 250,000 Victorians up to $975 a year at a cost of $230 million over five years.
      kind: pledge
      source:
        url: https://www.viclabor.org.au/news/labor-will-cut-land-tax-to-help-with-the-cost-of-living
        publisher: Victorian Labor
        title: Labor Will Cut Land Tax to Help with the Cost of Living
        published: 2026-10-04
        accessed: 2026-10-05
