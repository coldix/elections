# Sitting members of the Victorian Legislative Council (upper house), 2022-2026.
# 40 members: 5 elected from each of the 8 regions at the 2022 election.
# This records who currently HOLDS each seat, including mid-term replacements and
# party changes since 2022 — it is not the 2022 election result.
# Candidacies for 2026 are tracked separately in candidates/; a member appearing
# here is NOT thereby a 2026 candidate (see docs/METHODOLOGY.md).
