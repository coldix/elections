candidate:
  name: Sonny Stephens
  party: labor
  contest: gippsland-east
  chamber: assembly
  status: nominated
  history:
    - status: announced
      date: 2026-05-05
      source:
        url: "https://latrobevalleyexpress.com.au/news/2026/05/05/lund-officially-runni\
          ng-for-labor/"
        title: Lund officially running for Labor
        publisher: Latrobe Valley Express
        published: 2026-05-05
        accessed: 2026-05-19
      note: >-
        Article names Stephens as Labor's state candidate but incorrectly says
        Gippsland South. Victorian Labor's candidate page confirms Gippsland
        East (see corrections).
    - status: endorsed
      date: 2026-08-14
      source:
        url: https://www.viclabor.org.au/our-team/sonny-stephens
        title: Sonny Stephens | Labor Candidates
        publisher: Victorian Labor
        accessed: 2026-09-14
      note: >-
        Party candidate page lists Sonny Stephens as Candidate for Gippsland
        East.
    - status: nominated
      date: 2026-11-09
      source:
        url: https://www.vec.vic.gov.au/-/media/f487c2abe7274ed4b5bb60daa2b001ad.xls
        title: Candidate Contact Persons' Details Summary Report, State Election 2026
          (as at 9 Nov 2026 7:58 pm AEDT)
        publisher: Victorian Electoral Commission
        published: 2026-11-09
        accessed: 2026-11-11
      note: VEC final nominations report lists STEPHENS, Sonny for gippsland-east
        (assembly); spreadsheet row 387. Only candidate name, electorate and
        party were extracted, not contact details.
  corrections:
    - date: 2026-09-14
      was: contest gippsland-south
      now: contest gippsland-east
      reason: >-
        Ledger previously followed the Latrobe Valley Express (5 May 2026),
        which said Stephens was running for Gippsland South. Victorian Labor's
        own candidate page is the primary source and lists Gippsland East.
        GitHub issue #35 flagged the mismatch.
      source:
        url: https://www.viclabor.org.au/our-team/sonny-stephens
        publisher: Victorian Labor
        title: Sonny Stephens | Labor Candidates
        accessed: 2026-09-14
  links:
    - url: https://www.viclabor.org.au/our-team/sonny-stephens
      kind: party-profile
