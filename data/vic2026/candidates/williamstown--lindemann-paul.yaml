        title: "Ex-Liberal Lindemann to run as an independent"
        publisher: Star Weekly
        published: 2026-11-13
        accessed: 2026-11-14
      note: >-
        Lindemann told Star Weekly on 13 November 2026 that he will keep
        campaigning for Williamstown as an independent. The VEC ballot-order
        list for Williamstown (checked 14 November 2026) still shows him under
        the Liberal label, as nominations closed before his disendorsement.
