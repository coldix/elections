# Template for a candidacy record. Files starting with _ are ignored by
# validation and export. One file per candidacy; filename convention:
# <contest-slug>--<surname>-<given>.yaml  e.g. nepean--citizen-jane.yaml
# All values below are FICTIONAL.
candidate:
  name: Jane Citizen
  party: one-nation            # slug from parties.yaml
  contest: nepean              # district slug (assembly) or region slug (council)
  chamber: assembly            # assembly | council
  status: endorsed             # current status; see docs/methodology.md
  history:
    - status: announced
      date: 2026-08-01
      source:
        url: https://example.com/news/jane-citizen-to-stand
        publisher: Example News
        title: Jane Citizen to stand in Nepean
        published: 2026-08-01
        accessed: 2026-08-02
    - status: endorsed
      date: 2026-09-10
      source:
        url: https://example.com/party/candidates
        publisher: Example Party
        title: Endorsed candidates
        published: 2026-09-10
        accessed: 2026-09-11
      note: ""                 # optional, neutral wording only
  corrections: []              # entries: {date, was, now, reason, source}
  occupation: "Teacher"        # optional; public occupation only
  background: "Former school principal"  # optional one-liner; not family/sex
  links:                       # optional public campaign links
    - url: https://example.com/janecitizen
      kind: campaign-site
