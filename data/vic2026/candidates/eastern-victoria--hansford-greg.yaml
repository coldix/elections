candidate:
  name: Greg Hansford
  party: one-nation
  contest: eastern-victoria
  chamber: council
  status: withdrawn
  occupation: "Gippsland campaigner"
  background: "Newborough-based; previous One Nation candidate for federal Gippsland (2025)."
  history:
    - status: endorsed
      date: 2026-08-04
      source:
        url: https://www.gippslandtimes.com.au/news/2026/08/04/hansford-to-stand-for-one-nation-this-november/
        publisher: Gippsland Times
        title: "Hansford to stand for One Nation this November"
        published: 2026-08-04
        accessed: 2026-08-06
      note: >-
        Local report that Greg Hansford will lead the One Nation Legislative
        Council ticket for the Eastern Victoria region at the November 2026
        state election (filling the upper-house lead after Warren Pickering’s
        Assembly candidacy for Pakenham was confirmed).
    - status: withdrawn
      date: 2026-10-01
      source:
        url: https://www.gippslandtimes.com.au/news/2026/10/01/07-10-greg-hansford-is-out/
        publisher: Gippsland Times
        title: "Hansford forced to step away, One Nation looks for new candidate"
        published: 2026-10-01
        accessed: 2026-10-19
      note: >-
        Local report that Greg Hansford will no longer be One Nation's
        candidate for the Eastern Victoria upper house region at the November
        2026 election, and that the party is looking for a new candidate.
        One Nation Victoria's candidates page still listed him on
        19 October 2026.
