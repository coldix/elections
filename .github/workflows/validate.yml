name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Order matters: data must be valid before it is exported, and exported
      # before the site is built. Any failure here stops the run, so Cloudflare
      # never deploys a build made from invalid or unsourced records.
      - name: Validate data (schema, vocabulary, sources, referential integrity)
        run: npm run validate

      - name: Generate JSON + CSV exports
        run: npm run export

      - name: Write build meta
        run: node scripts/write-build-meta.mjs

      - name: Build site
        run: npx astro build --root site

      - name: Rewrite scoped election links and reject legacy links
        run: node scripts/rewrite-scoped-routes.mjs

      - name: Finalise sitemap
        run: node scripts/finalize-sitemap.mjs

      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: data-exports
          path: site/public/data/

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist/
